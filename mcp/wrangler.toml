# Yala MCP — conector de Yala para tu IA (Claude, ChatGPT, Grok): lee, y deja borradores en la Bandeja. Worker PROPIO, separado del gateway (docs/exploracion/plugin-claude-mcp.md §3):
# no lleva GROUPS_ENC_KEY, y un deploy suyo no alcanza al sync de la app.
#
# Dos entornos: staging (el de arriba, `npm run deploy:staging`) y producción (`[env.production]`, abajo). Producción
# está ESCRITO pero NO desplegado: lo despliega Jürgen con `npm run deploy:production`, que antes comprueba que no
# quede nada PENDIENTE. Pasos, secretos y marcha atrás: mcp/RUNBOOK-produccion.md.
#
# Si la configuración está mal (producción apuntando a staging, anon key de otro proyecto, un id PENDIENTE, sin
# límites de peticiones…) el Worker no atiende: 503 a todo (src/config.ts).
#
# Este Worker es el SERVIDOR OAUTH de Claude (ADR «El conector de Claude emite sus propios tokens», docs/DECISIONS.md):
# Claude recibe un token opaco del Worker, y el Worker lee con una sesión de Supabase de solo lectura
# (role = yala_mcp_reader) que consigue como cliente OAuth CONFIDENCIAL de Supabase y guarda cifrada en KV.
#
# Secreto (no va aquí): SUPABASE_OAUTH_CLIENT_SECRET, con `wrangler secret put` (y `--env production`). Se guarda en
# ~/Secrets/yala-mcp-staging/supabase-oauth-client.json (producción: ~/Secrets/yala-mcp-production/). La URL de Supabase, la anon key y el id del cliente son públicos.

name = "yala-mcp-staging"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# Las salidas de `fetch` van siempre por internet público (protección SSRF). El Worker solo habla con Supabase.
compatibility_flags = ["global_fetch_strictly_public"]
account_id = "86c270a7776be98639700bd5959b303b"
workers_dev = true

[observability]
enabled = true

# Clientes de Claude, grants y tokens (solo por hash) y las transacciones de consentimiento de la librería OAuth.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "9705886913ee4d1fb7217ef6e3ecdef7"

[vars]
ENVIRONMENT = "staging"
PUBLIC_URL = "https://yala-mcp-staging.misty-surf-6866.workers.dev"
SUPABASE_URL = "https://fostjbbwstyuunmmefuk.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvc3RqYmJ3c3R5dXVubW1lZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTAxNTMsImV4cCI6MjA5OTAyNjE1M30.gTWg5a8NKNuL_RhOmaaSGhnJpdV6iMXhwYwZVJb-FKg"
# El cliente OAuth del Worker en Supabase staging (confidencial, registrado el 2026-09-26). El hook solo le da tokens a él
# (qa/cloud/mcp0_02_oauth_client_allowlist.sql).
SUPABASE_OAUTH_CLIENT_ID = "65fb5767-59a5-4f50-b77c-7970e67589c5"
# Zona por defecto para «este mes» cuando Claude no pasa zona_horaria. El servidor no conoce la del teléfono.
DEFAULT_TIMEZONE = "America/Lima"

# La cola de la Bandeja (src/writeTool.ts, `apuntar_movimiento`): llamada interna a la clase RPC `ConnectorDrafts` del
# gateway, sin ruta pública. Sin este binding la herramienta de escritura no se ofrece. ORDEN DE DESPLIEGUE: primero el
# gateway (migración 0004 + el código con la clase), después este Worker.
[[services]]
binding = "CONNECTOR_DRAFTS"
service = "yala-gateway-staging"
entrypoint = "ConnectorDrafts"

# Vueltas OAuth extra (src/authorize.ts): la de Grok cuando se mida. Un intento rechazado deja la vuelta en el log
# (`wrangler tail`, evento `mcp_autorizacion`, motivo `vuelta_no_permitida`). Se añade como var:
#   EXTRA_REDIRECT_URIS = "https://…exacta…"

# Límites de peticiones (src/ratelimit.ts). Binding Rate Limiting de Workers: sin coste aparte, contador aproximado
# por ubicación. Periodo: 10 o 60 s. `namespace_id` es un entero único en la cuenta (el gateway no usa este binding).
#   RL_BROWSER, por IP: /authorize, /oauth/consent y la vuelta de Supabase (el navegador del usuario).
#   RL_OAUTH,   por IP y generoso: /oauth/register y /oauth/token (claude.ai llama desde pocas IPs de Anthropic).
#   RL_MCP,     por usuario: /mcp.
[[ratelimits]]
name = "RL_BROWSER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_OAUTH"
namespace_id = "7302"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_MCP"
namespace_id = "7303"
simple = { limit = 120, period = 60 }

# ---------- PRODUCCIÓN — escrito, NO desplegado. Runbook: mcp/RUNBOOK-produccion.md ----------
# En wrangler, `vars`, `kv_namespaces` y `ratelimits` NO se heredan del nivel de arriba: se repiten aquí enteros.
# Lo que dice PENDIENTE lo crea Jürgen siguiendo el runbook; `npm run deploy:production` se niega mientras quede uno.
[env.production]
name = "yala-mcp-production"
# Mismo patrón que el gateway de producción (yala-gateway-production.misty-surf-6866.workers.dev). Un dominio propio
# (mcp.yala-app.pe) exige mover el DNS de yala-app.pe a Cloudflare: hoy está en RCP. Ver el runbook, «Dominio propio».
workers_dev = true

[env.production.observability]
enabled = true

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
# `npx wrangler kv namespace create yala-mcp-production-oauth` → su id aquí.
id = "PENDIENTE-crear-kv-yala-mcp-production-oauth"

[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_URL = "https://yala-mcp-production.misty-surf-6866.workers.dev"
# Supabase PRODUCCIÓN (proyecto kefvaiymtgytemwbltlz), las mismas URL y anon key que el gateway de producción.
SUPABASE_URL = "https://kefvaiymtgytemwbltlz.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZnZhaXltdGd5dGVtd2JsdGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTg0MDYsImV4cCI6MjA5OTM3NDQwNn0.H8P3-kNUjeK8CTNZHwhfkqwqeflrNXLGvNa7OGGXkAk"
# El cliente OAuth CONFIDENCIAL del Worker en Supabase producción. Se registra en el runbook (paso 3); el mismo id va
# en el hook de producción (mcp0_02/mcp0_03 con este id).
SUPABASE_OAUTH_CLIENT_ID = "PENDIENTE-registrar-cliente-oauth-en-supabase-produccion"
DEFAULT_TIMEZONE = "America/Lima"

[[env.production.ratelimits]]
name = "RL_BROWSER"
namespace_id = "7311"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "RL_OAUTH"
namespace_id = "7312"
simple = { limit = 600, period = 60 }

[[env.production.ratelimits]]
name = "RL_MCP"
namespace_id = "7313"
simple = { limit = 120, period = 60 }

# La cola de la Bandeja en producción: el gateway de producción con la migración 0004 y la clase `ConnectorDrafts`
# desplegados ANTES que este Worker (mcp/RUNBOOK-produccion.md, «Tu IA registra en Yala»).
[[env.production.services]]
binding = "CONNECTOR_DRAFTS"
service = "yala-gateway-production"
entrypoint = "ConnectorDrafts"
