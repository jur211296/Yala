# Yala web — la app en el navegador como un aparato más de la cuenta en la nube. Worker PROPIO, aparte del gateway y del
# conector: un despliegue suyo no alcanza al sync de la app. Plan y decisiones: docs/web-app/index.html.
#
# Lote 0 (2026-11-13): SOLO staging. No hay `[env.production]` a propósito: producción pide antes su cliente OAuth, su
# hook, el widget real de Turnstile y el dominio app.yala-app.pe (DNS hoy en RCP). Ver webapp/README.md.
#
# Si la configuración está mal (id de cliente PENDIENTE, sin secretos, Turnstile de prueba en producción…) el Worker no
# atiende: 503 a todo (src/worker/config.ts).
#
# Secretos (no van aquí), con `wrangler secret put`:
#   SUPABASE_OAUTH_CLIENT_SECRET  ~/Secrets/yala-web-staging/supabase-oauth-client.json
#   TURNSTILE_SECRET_KEY          en staging, la clave de prueba de Cloudflare que siempre pasa (ver README)

name = "yala-web-staging"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"
# Las salidas de `fetch` van siempre por internet público (protección SSRF). Solo habla con Supabase y Turnstile.
compatibility_flags = ["global_fetch_strictly_public"]
account_id = "86c270a7776be98639700bd5959b303b"
workers_dev = true

[observability]
enabled = true

# La página (Vite). `run_worker_first`: TODO pasa por el Worker, que pone las cabeceras de seguridad también a la página.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Sesiones web (por el hash de la cookie, tokens cifrados) y logins a medias (10 min).
[[kv_namespaces]]
binding = "WEB_KV"
id = "aaee191d09924a7bbbdaa912cd1bcf05"

[vars]
ENVIRONMENT = "staging"
PUBLIC_URL = "https://yala-web-staging.misty-surf-6866.workers.dev"
SUPABASE_URL = "https://fostjbbwstyuunmmefuk.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvc3RqYmJ3c3R5dXVubW1lZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTAxNTMsImV4cCI6MjA5OTAyNjE1M30.gTWg5a8NKNuL_RhOmaaSGhnJpdV6iMXhwYwZVJb-FKg"
# El cliente OAuth CONFIDENCIAL de la web en Supabase staging (registrado el 2026-11-13). El hook le da yala_mcp_reader
# (webapp/supabase/web0_01_hook_web_client.sql).
SUPABASE_OAUTH_CLIENT_ID = "03e0f13b-818f-4a93-8e69-701ea6343fda"
# Clave de PRUEBA de Turnstile (siempre pasa). Pendiente: el widget real, que wrangler no puede crear sin el permiso
# challenge-widgets.write. config.ts la rechaza en producción.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Límites (src/worker/ratelimit.ts). `namespace_id`: entero único en la cuenta (el conector usa 7301-7313).
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "7401"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "7402"
simple = { limit = 120, period = 60 }
