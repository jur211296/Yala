# Yala web — la app en el navegador como un aparato más de la cuenta en la nube. Worker PROPIO, aparte del gateway y del
# conector: un despliegue suyo no alcanza al sync de la app. Plan y decisiones: docs/web-app/index.html.
#
# Dos entornos: staging (el de arriba, `npm run deploy:staging`) y producción (`[env.production]`, abajo, escrito el
# 2026-11-15 y NO desplegado). Lo que falta para desplegar producción y en qué orden: docs/web-app/produccion/.
#
# Si la configuración está mal (id de cliente PENDIENTE, sin secretos, Turnstile de prueba en producción…) el Worker no
# atiende: 503 a todo (src/worker/config.ts).
#
# Secretos (no van aquí), con `wrangler secret put`:
#   SUPABASE_OAUTH_CLIENT_SECRET  ~/Secrets/yala-web-staging/supabase-oauth-client.json
#   TURNSTILE_SECRET_KEY          en staging, la clave de prueba de Cloudflare que siempre pasa (ver README)

name = "yala-web-staging"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"
# Las salidas de `fetch` van siempre por internet público (protección SSRF). Solo habla con Supabase y Turnstile.
compatibility_flags = ["global_fetch_strictly_public"]
account_id = "86c270a7776be98639700bd5959b303b"
workers_dev = true

[observability]
enabled = true

# La página (Vite). `run_worker_first`: TODO pasa por el Worker, que pone las cabeceras de seguridad también a la página.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Sesiones web (por el hash de la cookie, tokens cifrados) y logins a medias (10 min).
[[kv_namespaces]]
binding = "WEB_KV"
id = "aaee191d09924a7bbbdaa912cd1bcf05"

# La cola COMÚN de borradores (decisión D9): el D1 del gateway de staging. La web solo inserta filas `source: "web"` en
# `mail_drafts` y cuenta las suyas (src/worker/drafts.ts); el iPhone las recoge por `GET /mail/drafts` del gateway.
[[d1_databases]]
binding = "DRAFTS_DB"
database_name = "yala-gateway-staging"
database_id = "6f76834b-62b4-4ec4-bb4f-db974b60f2ee"

# La lista de sesiones web de cada cuenta (lo que enseña «Navegadores conectados»): un objeto por cuenta, con SQLite.
# No va en el KV: su `list` es eventual y una sesión recién abierta tardaba hasta un minuto en verse (src/worker/sessions.ts).
[[durable_objects.bindings]]
name = "SESSION_INDEX"
class_name = "SessionIndex"

[[migrations]]
tag = "v1-sesiones"
new_sqlite_classes = ["SessionIndex"]

# «Entrar con tu iPhone» (lote 2): un objeto por código QR, que una alarma vacía al caducar (src/worker/pairing.ts).
[[durable_objects.bindings]]
name = "QR_PAIRING"
class_name = "QrPairing"

[[migrations]]
tag = "v2-qr"
new_sqlite_classes = ["QrPairing"]

[vars]
ENVIRONMENT = "staging"
DEFAULT_TIMEZONE = "America/Lima"
PUBLIC_URL = "https://yala-web-staging.misty-surf-6866.workers.dev"
SUPABASE_URL = "https://fostjbbwstyuunmmefuk.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvc3RqYmJ3c3R5dXVubW1lZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTAxNTMsImV4cCI6MjA5OTAyNjE1M30.gTWg5a8NKNuL_RhOmaaSGhnJpdV6iMXhwYwZVJb-FKg"
# El cliente OAuth CONFIDENCIAL de la web en Supabase staging (registrado el 2026-11-13). El hook le da yala_mcp_reader
# (webapp/supabase/web0_01_hook_web_client.sql).
SUPABASE_OAUTH_CLIENT_ID = "03e0f13b-818f-4a93-8e69-701ea6343fda"
# Clave de PRUEBA de Turnstile (siempre pasa). Pendiente: el widget real, que wrangler no puede crear sin el permiso
# challenge-widgets.write. config.ts la rechaza en producción.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Límites (src/worker/ratelimit.ts). `namespace_id`: entero único en la cuenta (el conector usa 7301-7313).
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "7401"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "7402"
simple = { limit = 120, period = 60 }

# El navegador pregunta por su código QR cada ~2,5 s y lo renueva cada minuto.
[[ratelimits]]
name = "RL_QR"
namespace_id = "7403"
simple = { limit = 60, period = 60 }

# Grupos (lote 3): la entrada interna del gateway de staging que lee Grupos con el token de la web. Es un service
# binding: no sale a internet ni tiene ruta pública. La llave del cifrado de Grupos se queda en el gateway.
[[services]]
binding = "GATEWAY_GROUPS"
service = "yala-gateway-staging"
entrypoint = "WebGroupsReader"

# Grupos (lote 3, opción A de Jürgen del 14-nov): la entrada interna que AÑADE gastos y pagos e invita, con el rol propio
# de la web (`yala_web`, web3_02). Solo staging hasta una revisión.
[[services]]
binding = "GATEWAY_GROUPS_WRITER"
service = "yala-gateway-staging"
entrypoint = "WebGroupsWriter"

# ---------- PRODUCCIÓN — escrito el 2026-11-15, NO desplegado. Orden y lo que falta: docs/web-app/produccion/ ----------
# En wrangler, `vars`, `kv_namespaces`, `d1_databases`, `durable_objects`, `services` y `ratelimits` NO se heredan del
# nivel de arriba: se repiten aquí enteros. Lo que dice PENDIENTE hace que `config.ts` responda 503 a todo (falla
# cerrado), así que un despliegue a medias no atiende a nadie.
#
# Secretos (no van aquí), con `wrangler secret put … --env production`:
#   SUPABASE_OAUTH_CLIENT_SECRET  el del cliente OAuth «Yala web» de Supabase PRODUCCIÓN (se guarda también en
#                                 ~/Secrets/yala-web-production/supabase-oauth-client.json, en el mismo gesto)
#   TURNSTILE_SECRET_KEY          el del widget REAL de Turnstile (config.ts rechaza las claves de prueba)
#
# Desplegar: `npx vite build && npx wrangler deploy --env production`. No hay `deploy:production` todavía a propósito:
# el paso lo da Jürgen cuando la base de Supabase, el widget y el dominio estén.
[env.production]
name = "yala-web-production"
# Dominio propio: la zona yala-app.pe YA está en esta cuenta de Cloudflare (activa desde el 2026-11-05, medido el
# 2026-11-15), así que `custom_domain` crea el registro y el certificado al desplegar sin tocar la web pública (Vercel,
# en el apex). Mismo mecanismo que mcp.yala-app.pe y panel.yala-app.pe. Si se elige otro nombre, cambian esta línea,
# PUBLIC_URL, el widget de Turnstile y la vuelta del cliente OAuth de Supabase.
routes = [{ pattern = "app.yala-app.pe", custom_domain = true }]
# Solo el dominio: el widget de Turnstile y la cookie `__Host-` van atados a un host, y un segundo host lo rompería.
workers_dev = false

[env.production.observability]
enabled = true

[env.production.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.production.kv_namespaces]]
binding = "WEB_KV"
# `npx wrangler kv namespace create yala-web-production` → su id aquí.
id = "PENDIENTE-crear-kv-yala-web-production"

# La cola COMÚN de borradores en producción: el D1 del gateway de producción (mismo esquema de `mail_drafts` que staging,
# medido el 2026-11-15).
[[env.production.d1_databases]]
binding = "DRAFTS_DB"
database_name = "yala-gateway-production"
database_id = "60cdd68d-cc37-4a11-8d1a-bcc5f4354118"

[[env.production.durable_objects.bindings]]
name = "SESSION_INDEX"
class_name = "SessionIndex"

[[env.production.durable_objects.bindings]]
name = "QR_PAIRING"
class_name = "QrPairing"

[env.production.vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "America/Lima"
PUBLIC_URL = "https://app.yala-app.pe"
# Supabase PRODUCCIÓN (kefvaiymtgytemwbltlz): las mismas URL y anon key públicas que el gateway de producción.
SUPABASE_URL = "https://kefvaiymtgytemwbltlz.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZnZhaXltdGd5dGVtd2JsdGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTg0MDYsImV4cCI6MjA5OTM3NDQwNn0.H8P3-kNUjeK8CTNZHwhfkqwqeflrNXLGvNa7OGGXkAk"
# El cliente OAuth CONFIDENCIAL de la web en Supabase producción, con vuelta https://app.yala-app.pe/auth/supabase/callback.
# El mismo id va en los SQL de producción (`python3 webapp/supabase/sql_produccion.py <conector> <este-id> <carpeta>`).
SUPABASE_OAUTH_CLIENT_ID = "PENDIENTE-registrar-cliente-oauth-web-en-supabase-produccion"
# La clave PÚBLICA del widget real de Turnstile (hostname app.yala-app.pe). El secreto va con `wrangler secret put`.
TURNSTILE_SITE_KEY = "PENDIENTE-crear-widget-turnstile"

# Mismos límites que staging, con su propio espacio (staging usa 7401-7403; el conector, 7301-7313).
[[env.production.ratelimits]]
name = "RL_AUTH"
namespace_id = "7411"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "RL_API"
namespace_id = "7412"
simple = { limit = 120, period = 60 }

[[env.production.ratelimits]]
name = "RL_QR"
namespace_id = "7413"
simple = { limit = 60, period = 60 }

# Grupos: las dos entradas internas del gateway de PRODUCCIÓN. Hoy el gateway de producción no declara
# WEB_GROUPS_READER ni WEB_GROUPS_WRITER, así que ambas responden «disabled» y las rutas de Grupos de la web dan 503.
# Encenderlas es un despliegue del gateway (`gateway/wrangler.toml`, `[env.production.vars]`), el último paso del orden.
[[env.production.services]]
binding = "GATEWAY_GROUPS"
service = "yala-gateway-production"
entrypoint = "WebGroupsReader"

[[env.production.services]]
binding = "GATEWAY_GROUPS_WRITER"
service = "yala-gateway-production"
entrypoint = "WebGroupsWriter"
