<style>

  --ok: #3CC9B8; --on-nec: #1A0A10; color-scheme: dark; } }

* { box-sizing: border-box; }

  const barra = ORDEN.map(k => { const n = cuenta(H, k); return n ? `<span class="k-${k}" style="flex:${n};background:var(--kc)" title="${K[k].n}: ${n}"></span>` : ""; }).join("");
  const tiles = Object.entries(G).map(([g, m]) => {
    const l = porGrupo(g);
    const subs = ORDEN.filter(k => K[k].g === g).map(k => `<span class="chip k-${k} ${k === "ver" || k === "sin" ? k : ""}">${K[k].n} · ${cuenta(l, k)}</span>`).join("");
    return `<div class="group ${g}"><div class="num">${l.length}</div><h3>${m.n}</h3><p>${m.d}</p><div class="subs">${subs}</div></div>`;
  }).join("");

  const cols = [["nec"], ["y22"], ["dat", "dec"], ["red"], ["men"], ["ver"], ["sin"]];
  const colNom = ["Necesaria", "Ya en 2.2", "Decisión", "Rediseño", "Menor", "Por verificar", "Sin clasificar"];
  const max = Math.max(...D.zonas.flatMap(z => cols.map(c => H.filter(h => h.z === z.num && c.includes(h.k)).length)));
  const filas = D.zonas.map(z => {
    const hz = H.filter(h => h.z === z.num);
    const celdas = cols.map(c => {
      const n = hz.filter(h => c.includes(h.k)).length;
      return `<td><span class="dot k-${c[c.length - 1]} ${n ? "" : "zero"}" style="--a:${n ? Math.round(10 + 40 * n / max) : 0}">${n || "·"}</span></td>`;
    }).join("");
    const lts = [...new Set(hz.filter(h => h.l).map(h => h.l))].sort((a, b) => (isNaN(a) ? -1 : +a) - (isNaN(b) ? -1 : +b));
    return `<tr data-ir="${z.slug}"><td class="zn"><a href="#${z.slug}"><span>${z.num}</span>${esc(z.corto)}</a></td>${celdas}<td class="tot">${hz.length}</td><td class="lts"><div>${lts.map(loteChip).join("") || '<span class="muted">—</span>'}</div></td></tr>`;
  }).join("");
  const pie = cols.map(c => `<td>${H.filter(h => c.includes(h.k)).length}</td>`).join("");

  const tarjeta = l => {
    const hs = H.filter(h => h.l === l.id);
    const zs = [...new Set(hs.map(h => h.z))].map(n => `<a class="zchip" href="#${Z[n].slug}">${esc(Z[n].corto)}</a>`).join("");
    const li = hs.map(h => `<li><a href="#${Z[h.z].slug}" data-ir-fila="${rowId(h)}"><span>${esc(Z[h.z].corto)}</span><span>${esc(h.t)}</span></a></li>`).join("");
    const hecho = l.estado === "hecho";
    return `<article class="lote ${hecho ? "hecho" : ""}" id="lote-${esc(l.id)}">
      <div class="cab"><div class="n">${loteNum(l.id)}</div><div><h3>${esc(l.titulo)}</h3></div></div>
      <div class="meta"><span class="estado ${hecho ? "hecho" : ""}">${hecho ? "Mergeado en 2.3" : "Pendiente · sin encolar"}</span><span>·</span><span>${l.puntos} puntos${hs.length !== l.puntos ? ` · ${hs.length} hallazgos` : ""}</span>${l.adv ? `<span class="adv">Review adversarial: ${esc(l.adv)}</span>` : ""}</div>
      <div class="meta">${zs}</div>
      <ul>${li}</ul>
      <a class="pie" href="${l.url}" target="_blank" rel="noopener">${hecho ? "Ver el PR" : "Ver el encargo"} ↗</a>
    </article>`;
  };

  const decs = D.decisiones.map(d => `<article class="dec"><h3>${esc(d.t)}</h3><p>${esc(d.d)}</p><div class="zs">${d.z.map(s => { const z = D.zonas.find(x => x.slug === s); return `<a class="zchip" href="#${s}">${esc(z.corto)}</a>`; }).join("")}</div></article>`).join("");
  const notas = D.notas.map((n, i) => `<div class="nota ${i === D.notas.length - 1 ? "ok" : ""}"><strong>${esc(n.t)}</strong><p>${esc(n.d)}</p>${n.u ? `<a href="${n.u}" target="_blank" rel="noopener">Ver el documento ↗</a>` : ""}</div>`).join("");
  const leyenda = ORDEN.map(k => `<div>${chip(k)}<p>${K[k].d}</p></div>`).join("");

  return `
  <div class="hero">
    <span class="eyebrow">Yala 2.3 · revisión por vistas y consolidación</span>
    <h1>Todo lo que encontramos, vista por vista</h1>
    <p class="lede">Once revisiones del 7 al 9 de noviembre y una consolidación en lotes. Lo rojo es lo que hay que arreglar; lo demás espera una decisión o puede esperar.</p>
    <div class="stats">
      <div><strong>${total}</strong><span>hallazgos</span></div>
      <div><strong>${D.zonas.length}</strong><span>vistas</span></div>
      <div><strong>${lotesPend.length}</strong><span>lotes pendientes</span></div>
      <div><strong>${D.lotes.length - lotesPend.length}</strong><span>lotes ya hechos</span></div>
    </div>
  </div>
  <div class="bar" role="img" aria-label="${ORDEN.map(k => `${K[k].n} ${cuenta(H, k)}`).join(", ")}">${barra}</div>
  <div class="groups">${tiles}</div>

  <section>
    <header><h2>Por vista y por nivel</h2><p>Toca una fila para abrir la vista.</p></header>
    <div class="scroll"><table class="mx">
      <thead><tr><th class="zn">Vista</th>${colNom.map(c => `<th>${c}</th>`).join("")}<th>Total</th><th style="text-align:left">Lotes</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr><td class="zn">Total</td>${pie}<td>${total}</td><td></td></tr></tfoot>
    </table></div>
  </section>

  <section id="lotes">
    <header><h2>Los lotes</h2><p>Once pendientes, en el orden de la consolidación: datos y cifras primero.</p></header>
    <div class="hechos">${D.lotes.filter(l => l.estado === "hecho").map(tarjeta).join("")}</div>
    <div class="lotes">${lotesPend.map(tarjeta).join("")}</div>
  </section>

  <section>
    <header><h2>Decisiones que frenan algo</h2><p>Las que se repiten entre vistas. Cada ficha trae su lista completa.</p></header>
    <div class="decs">${decs}</div>
  </section>

  <section>
    <header><h2>Lo que no cuadra entre documentos</h2></header>
    <div class="notas">${notas}</div>
  </section>

  <section>
    <header><h2>Qué significa cada nivel</h2><p>La clasificación es la de la consolidación; no se inventó otra.</p></header>
    <div class="legend">${leyenda}</div>
  </section>

  <footer class="pie">
    <span>Entra cada problema priorizado y cada hallazgo secundario de las once fichas, más lo que nombran los lotes y sus tickets. No entran perfiles, eficiencia ni terminología.</span>
    <span>Fuentes: <a href="${D.consolidacion}" target="_blank" rel="noopener">consolidación (PR 866)</a> · <a href="${PR(854)}" target="_blank" rel="noopener">lote de Panel (PR 854)</a> · <a href="${PR(855)}" target="_blank" rel="noopener">lote de Formulario (PR 855)</a> · índices (<a href="${PR(850)}" target="_blank" rel="noopener">PR 850</a>, <a href="${PR(851)}" target="_blank" rel="noopener">PR 851</a>).</span>
  </footer>`;
}

function fila(h) {
  const z = Z[h.z];
  const s = SEV[h.s];
  const izq = h.img
    ? `<button type="button" class="mini" data-foto="${esc(h.img)}" data-pie="${esc(z.corto + " · " + h.c)}" aria-label="Ver captura de ${esc(h.c)}"><img src="${esc(h.img)}" alt="" loading="lazy"></button>`
    : `<div class="cod">${esc(h.c)}</div>`;
  const sev = s ? `<span class="sev"><span class="bars" aria-hidden="true">${[1, 2, 3].map(i => `<u class="${i <= s[1] ? "on" : ""}"></u>`).join("")}</span>${s[0]}</span>` : "";
  const origen = z.prs.map(n => `<a class="o" href="${PR(n)}" target="_blank" rel="noopener">PR ${n} ↗</a>`).join("");
  return `<article class="fila k-${h.k}" id="${rowId(h)}">
    ${izq}
    <div class="cuerpo">
      <div class="l1">${chip(h.k)}${h.img ? `<span class="c">${esc(h.c)}</span>` : ""}${sev}</div>
      <div class="texto">${esc(h.t)}</div>
      ${h.n ? `<div class="nota-f">${esc(h.n)}</div>` : ""}
      <div class="l3">${h.l ? loteChip(h.l) : ""}${origen}<a class="o" href="${z.ficha}" target="_blank" rel="noopener">Ficha ↗</a>${h.tk ? `<a class="o" href="${h.tk}" target="_blank" rel="noopener">Ticket ↗</a>` : ""}${h.l && !loteHecho(h.l) ? `<a class="o" href="${D.lotes.find(l => l.id === h.l).url}" target="_blank" rel="noopener">Encargo ↗</a>` : ""}</div>
    </div>
  </article>`;
}

function vista(z) {
  const hz = H.filter(h => h.z === z.num).sort((a, b) => ORDEN.indexOf(a.k) - ORDEN.indexOf(b.k));
  const imp = hz.filter(h => grupoDe(h) === "imp").length;
  const dec = hz.filter(h => grupoDe(h) === "dec").length;
  const barra = ORDEN.map(k => { const n = cuenta(hz, k); return n ? `<span class="k-${k}" style="flex:${n};background:var(--kc)" title="${K[k].n}: ${n}"></span>` : ""; }).join("");
  const fotos = z.fotos.map(f => `<button type="button" class="foto" data-foto="${esc(f.src)}" data-pie="${esc(z.corto + " · problema " + f.n + " · " + f.pie)}"><img src="${esc(f.src)}" alt="Captura del problema ${f.n}" loading="lazy"><span><b>${z.num === "30" ? "PN-" : "P"}${f.n}</b> ${esc(f.pie)}</span></button>`).join("");
  const grupos = Object.keys(G).map(g => {
    const l = hz.filter(h => grupoDe(h) === g);
    if (!l.length) return "";
    return `<div class="grupo" data-g="${g}"><h2>${G[g].n} <small>${l.length}</small></h2><p>${G[g].d}</p><div class="filas">${l.map(fila).join("")}</div></div>`;
  }).join("");
  const botones = [["todo", "Todo", hz.length]].concat(Object.keys(G).map(g => [g, G[g].n, hz.filter(h => grupoDe(h) === g).length]).filter(b => b[2]))
    .map(([id, n, c]) => `<button type="button" data-filtro="${id}" aria-pressed="${filtro === id}">${n} · ${c}</button>`).join("");
  const enlaces = z.prs.map(n => `<a class="lnk" href="${PR(n)}" target="_blank" rel="noopener">PR ${n} ↗</a>`).join("") + `<a class="lnk" href="${z.ficha}" target="_blank" rel="noopener">Ficha de la zona ↗</a>`;
  return `
  <a class="back" href="#portada">← Portada</a>
  <div class="zhead">
    <div>
      <span class="eyebrow">Zona ${z.num}</span>
      <h1>${esc(z.largo)}</h1>
      <p class="estado-z">${esc(z.estado)}</p>
      <div class="links">${enlaces}</div>
    </div>
    <div class="zcount"><div class="imp"><strong>${imp}</strong><span>importan</span></div><div><strong>${dec}</strong><span>a decidir</span></div><div><strong>${hz.length}</strong><span>en total</span></div></div>
  </div>
  <div class="bar" style="margin-top:18px">${barra}</div>
  ${fotos ? `<div class="fotos" aria-label="Capturas de los problemas">${fotos}</div>` : ""}
  <div class="filtros" role="group" aria-label="Filtrar">${botones}</div>
  <div id="grupos">${grupos}</div>`;
}

function aplicarFiltro() {
  document.querySelectorAll(".grupo").forEach(el => { el.hidden = filtro !== "todo" && el.dataset.g !== filtro; });
  document.querySelectorAll("[data-filtro]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filtro === filtro)));
}

function render() {
  const slug = (location.hash || "#portada").slice(1);
  const z = D.zonas.find(x => x.slug === slug);
  const app = document.getElementById("app");
  tabs(z ? z.slug : "portada");
  if (z) {
    if (!document.querySelector(`[data-zona="${z.slug}"]`)) filtro = "todo";
    app.innerHTML = vista(z);
    app.dataset.zona = z.slug;
    aplicarFiltro();
  } else {
    app.innerHTML = portada();
    app.removeAttribute("data-zona");
  }
  if (resaltar) {
    const el = document.getElementById(resaltar);
    resaltar = null;
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); return; }
  }
  if (pendienteLote) {
    const el = document.getElementById("lote-" + pendienteLote);
    pendienteLote = null;
    if (el) { el.scrollIntoView({ block: "start" }); return; }
  }
  window.scrollTo(0, 0);
}
let pendienteLote = null;

document.addEventListener("click", e => {
  const ir = e.target.closest("[data-ir-fila]");
  if (ir) { resaltar = ir.dataset.irFila; if (location.hash === ir.getAttribute("href")) { e.preventDefault(); render(); } return; }
  const lt = e.target.closest("[data-lote]");
  if (lt) { pendienteLote = lt.dataset.lote; if (location.hash === "#portada" || location.hash === "") { e.preventDefault(); render(); } return; }
  const tr = e.target.closest("tr[data-ir]");
  if (tr && !e.target.closest("a")) { location.hash = tr.dataset.ir; return; }
  const f = e.target.closest("[data-filtro]");
  if (f) { filtro = f.dataset.filtro; aplicarFiltro(); return; }
  const foto = e.target.closest("[data-foto]");
  if (foto) { abrirVisor(foto.dataset.foto, foto.dataset.pie); return; }
});

const visor = document.getElementById("visor");
function abrirVisor(src, pie) { document.getElementById("visor-img").src = src; document.getElementById("visor-pie").textContent = pie || ""; visor.hidden = false; document.getElementById("visor-cerrar").focus(); }
function cerrarVisor() { visor.hidden = true; }
visor.addEventListener("click", e => { if (e.target === visor || e.target.id === "visor-cerrar") cerrarVisor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !visor.hidden) cerrarVisor(); });
window.addEventListener("hashchange", render);
render();
</script>
