<title>Formularios guiados de Yala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Mesa de revisión oscura: barra fija arriba con los flujos; cada flujo es una fila de iPhones con su ficha y su comentario al lado. */
:root {
  color-scheme: dark;
  /* página */
  --bg: #08080d; --panel: #111119; --panel-2: #171722; --line: #262634; --fg: #ececf4; --muted: #9b9bb2; --faint: #6c6c82;
  --accent: #6063f1; --accent-text: #8f94fb; --pink: #ff4da6; --teal: #00c2cb; --ok: #34c77b; --warn: #f5b041;
  /* Yala oscuro (YalaTheme: fondo OLED, tarjeta #1C1C1E) */
  --y-bg: #000; --y-card: #1c1c1e; --y-card-2: #2c2c2e; --y-border: rgba(255,255,255,.08); --y-fg: #fff;
  --y-2: rgba(235,235,245,.6); --y-3: rgba(235,235,245,.3); --y-accent: #6063f1; --y-accent-text: #818cf8;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

/* ---------- barra ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(17,17,25,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-head); font-weight: 700; font-size: 16px; letter-spacing: -.01em; margin-right: auto; }
.brand small { font-family: var(--f-ui); font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 8px; }
.copy-btn { border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.copy-btn .n { background: rgba(255,255,255,.22); border-radius: 999px; padding: 0 7px; font-size: 12px; font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; color: var(--muted); border: 1px solid var(--line); background: var(--panel); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.nav a.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.nav a .c { font-size: 11px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.12); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
.nav a .c:empty { display: none; }
.nav .sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

/* ---------- página ---------- */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 80px; max-width: 1440px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-head); letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(24px, 4vw, 34px); line-height: 1.15; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
.lede { color: var(--muted); max-width: 70ch; margin: 8px 0 0; font-size: 15px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 600; color: var(--accent-text); }
section.view { display: flex; flex-direction: column; gap: 28px; }
.block { display: flex; flex-direction: column; gap: 12px; }
.prose p { margin: 0; max-width: 72ch; color: #d4d4e0; }
.prose ul { margin: 0; padding-left: 18px; max-width: 72ch; color: #d4d4e0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--panel-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: rgba(52,199,123,.15); color: #6fe0a5; }
.pill.no { background: rgba(255,255,255,.07); color: var(--muted); }
.pill.later { background: rgba(245,176,65,.14); color: #f7c873; }
.pill.lvl { background: rgba(96,99,241,.16); color: var(--accent-text); }
.order { font-family: var(--f-head); font-weight: 700; color: var(--accent-text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.note { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.note b { font-family: var(--f-head); }
.note p { margin: 0; color: #cfcfdc; font-size: 13px; }
.inv-form { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.inv-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.inv-head h3 { margin-right: auto; }
.inv-meta { color: var(--muted); font-size: 12px; }
.inv-form ul { margin: 0; padding-left: 18px; color: #d4d4e0; font-size: 13px; }
.inv-form .conf { color: #f7c873; }
details.fields summary { cursor: pointer; color: var(--accent-text); font-size: 13px; }
details.fields table { margin-top: 8px; }

/* ---------- flujo ---------- */
.flow-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.flow-facts { display: flex; gap: 8px; flex-wrap: wrap; }
.flow-facts .pill { white-space: normal; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.mode button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
.mode button.on { background: var(--panel-2); color: #fff; }
.screens { display: flex; flex-direction: column; gap: 22px; }
.screen-row { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 22px; align-items: start; border-top: 1px solid var(--line); padding-top: 22px; }
.screen-row:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 760px) { .screen-row { grid-template-columns: minmax(0, 1fr); justify-items: center; } .spec { width: 100%; } }
.spec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.spec-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.spec-title .idx { font-family: var(--f-head); font-weight: 700; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.spec dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; color: #e2e2ec; }
.cmt { display: flex; flex-direction: column; gap: 4px; }
.cmt label { font-size: 12px; color: var(--muted); }
.cmt textarea { width: 100%; min-height: 54px; resize: vertical; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; }
.cmt textarea:focus { border-color: var(--accent); outline: none; }
.cmt.has textarea { border-color: rgba(96,99,241,.6); background: #14142a; }
.walk { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.walk-nav { display: flex; gap: 10px; align-items: center; }
.walk-nav button { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.walk-nav button:disabled { opacity: .35; cursor: default; }
.walk-nav span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

/* ---------- iPhone ---------- */
.phone { width: 300px; max-width: 100%; height: 640px; border-radius: 46px; padding: 9px; background: #1a1a20; box-shadow: 0 0 0 1px #34343e, 0 18px 40px rgba(0,0,0,.55); flex: none; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; font-family: var(--f-ios); color: var(--y-fg); font-size: 13px; line-height: 1.32;
  background: radial-gradient(120% 55% at 50% -5%, rgba(96,99,241,.34), rgba(96,99,241,0) 70%), radial-gradient(90% 40% at 100% 100%, rgba(255,0,128,.12), rgba(255,0,128,0) 70%), var(--y-bg); display: flex; flex-direction: column; }
.sb { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0 30px; font-weight: 600; font-size: 13px; }
.sb .isl { width: 86px; height: 24px; background: #000; border-radius: 14px; box-shadow: 0 0 0 1px #111; }
.sb .bat { display: inline-flex; gap: 4px; align-items: center; }
.sb .bat i { width: 20px; height: 10px; border: 1.5px solid rgba(255,255,255,.8); border-radius: 3px; display: inline-block; position: relative; }
.sb .bat i::after { content: ""; position: absolute; inset: 1px 4px 1px 1px; background: #fff; border-radius: 1px; }
.hdr { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 4px; }
.gbtn { width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.gbtn svg { width: 14px; height: 14px; }
.hdr .ttl { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hdr .ttl b { font-size: 14px; }
.hdr .ttl span { font-size: 10.5px; color: var(--y-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.useform { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); color: var(--y-fg); }
.useform svg { width: 12px; height: 12px; }
.dots { flex: none; display: flex; gap: 4px; padding: 2px 16px 6px 50px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.2); }
.dots i.on { background: var(--y-accent); }
.body { flex: 1; overflow-y: auto; padding: 4px 14px 18px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.q { font-size: 18px; font-weight: 700; line-height: 1.22; letter-spacing: -.01em; }
.qd { color: var(--y-2); font-size: 12.5px; margin-top: 4px; }
.dock { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; background: var(--y-card); border-radius: 16px; padding: 10px 12px; box-shadow: inset 0 0 0 1.5px transparent; }
.opt.hl { box-shadow: inset 0 0 0 1.5px rgba(96,99,241,.6); }
.opt .ic { width: 22px; display: grid; place-items: center; color: var(--y-accent-text); flex: none; }
.opt .ic svg { width: 17px; height: 17px; }
.opt .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.opt .tx b { font-size: 13px; font-weight: 600; }
.opt .tx span { font-size: 10.5px; color: var(--y-2); }
.opt .chev { color: var(--y-3); font-size: 13px; }
.tiles { display: grid; gap: 8px; }
.tile { background: var(--y-card); border-radius: 16px; padding: 9px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; min-height: 88px; position: relative; box-shadow: inset 0 0 0 2px transparent; }
.tile .circ { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.tile .circ svg { width: 15px; height: 15px; }
.tile b { font-size: 10.5px; font-weight: 600; line-height: 1.15; }
.tile span { font-size: 9px; color: var(--y-2); line-height: 1.15; }
.tile .chk { position: absolute; top: 5px; right: 5px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; }
.tile .chk svg { width: 9px; height: 9px; color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 999px; background: var(--y-card); }
.chip.on { background: var(--y-accent); color: #fff; }
.lbl { font-size: 11px; color: var(--y-2); font-weight: 500; margin-top: 2px; }
.field { display: flex; align-items: center; gap: 8px; }
.input { flex: 1; min-width: 0; min-height: 40px; background: var(--y-card); border-radius: 16px; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
.input .sym { color: var(--y-2); font-weight: 600; font-size: 13px; }
.input .val { font-size: 16px; font-weight: 600; }
.input .val.txt { font-size: 13.5px; font-weight: 500; }
.input .ph { color: var(--y-3); font-size: 14px; font-weight: 500; }
.input .caret { width: 1.5px; height: 18px; background: var(--y-accent-text); }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--y-accent); display: grid; place-items: center; flex: none; }
.send.off { background: rgba(255,255,255,.12); }
.send svg { width: 15px; height: 15px; color: #fff; }
.tog { background: var(--y-card); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.tog .tx { flex: 1; display: flex; flex-direction: column; }
.tog .tx b { font-size: 13px; font-weight: 600; }
.tog .tx span { font-size: 10.5px; color: var(--y-2); }
.sw { width: 40px; height: 24px; border-radius: 999px; background: rgba(120,120,128,.36); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: #34c759; }
.sw.on::after { left: 18px; }
.row2 { background: var(--y-card); border-radius: 16px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.row2 span { color: var(--y-2); }
.row2 b { font-weight: 600; }
.row2 em { font-style: normal; color: var(--y-accent-text); font-weight: 600; font-size: 12px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--y-card); border-radius: 16px; padding: 8px; }
.days i { font-style: normal; text-align: center; font-size: 11px; padding: 5px 0; border-radius: 8px; color: var(--y-fg); }
.days i.on { background: var(--y-accent); color: #fff; font-weight: 700; }
.days i.h { color: var(--y-2); font-size: 9.5px; }
.seg { display: flex; background: rgba(118,118,128,.24); border-radius: 10px; padding: 2px; }
.seg i { flex: 1; text-align: center; font-style: normal; font-size: 11.5px; font-weight: 600; padding: 6px 4px; border-radius: 8px; color: var(--y-fg); }
.seg i.on { background: #636366; }
.list { background: var(--y-card); border-radius: 16px; overflow: hidden; }
.list .li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: .5px solid rgba(84,84,88,.6); font-size: 12.5px; }
.list .li:first-child { border-top: 0; }
.list .li .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.list .li .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list .li .tx span { font-size: 10.5px; color: var(--y-2); }
.list .li .rt { color: var(--y-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.list .li .rt.acc { color: var(--y-accent-text); font-weight: 600; }
.primary { background: var(--y-accent); color: #fff; font-weight: 600; font-size: 14px; text-align: center; border-radius: 999px; padding: 12px; }
.primary.off { background: rgba(96,99,241,.35); color: rgba(255,255,255,.55); }
.textlink { text-align: center; color: var(--y-accent-text); font-weight: 600; font-size: 13px; padding: 4px; }
.hint { font-size: 11px; color: var(--y-2); }
.hint.warn { color: #ffb86b; }
.bubble { align-self: flex-start; max-width: 88%; background: var(--y-card-2); border-radius: 16px 16px 16px 4px; padding: 8px 11px; font-size: 12.5px; }
.palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; background: var(--y-card); border-radius: 16px; padding: 10px; }
.palette i { aspect-ratio: 1; border-radius: 50%; }
.palette i.on { box-shadow: 0 0 0 2px var(--y-bg), 0 0 0 3.5px #fff; }
.icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: var(--y-card); border-radius: 16px; padding: 10px; }
.icons i { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; color: var(--y-2); background: rgba(255,255,255,.05); }
.icons i svg { width: 15px; height: 15px; }
.icons i.on { background: var(--y-accent); color: #fff; }
/* tarjeta que se llena */
.ycard { background: var(--y-card); border-radius: 18px; padding: 12px 13px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 0 .5px var(--y-border); }
.ycard .top1 { display: flex; gap: 10px; align-items: center; }
.ycard .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.ycard .ico svg { width: 16px; height: 16px; }
.ycard .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.ycard .nm b { font-size: 14px; }
.ycard .nm span { font-size: 10.5px; color: var(--y-2); }
.ycard .ph { color: var(--y-3) !important; }
.ycard .amt { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ycard .amt small { font-size: 11px; color: var(--y-2); font-weight: 500; display: block; letter-spacing: 0; }
.ycard .lines { display: flex; flex-wrap: wrap; gap: 5px; }
.ycard .lines i { font-style: normal; font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--y-2); }
.ycard .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.ycard .bar i { display: block; height: 100%; background: var(--y-accent); border-radius: 999px; }
/* confirmación y éxito */
.sum { background: var(--y-card); border-radius: 16px; overflow: hidden; }
.sum .sr { display: flex; gap: 10px; padding: 9px 12px; border-top: .5px solid rgba(84,84,88,.6); align-items: baseline; }
.sum .sr:first-child { border-top: 0; }
.sum .sr span { color: var(--y-2); font-size: 11.5px; width: 92px; flex: none; }
.sum .sr b { flex: 1; font-size: 12.5px; font-weight: 600; min-width: 0; }
.sum .sr em { font-style: normal; font-size: 11.5px; color: var(--y-accent-text); font-weight: 600; }
.done-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 10px 6px; }
.done-wrap .big { width: 64px; height: 64px; border-radius: 50%; background: rgba(52,199,89,.18); display: grid; place-items: center; color: #34c759; }
.done-wrap .big svg { width: 30px; height: 30px; }
.done-wrap h4 { margin: 0; font-size: 22px; font-weight: 700; }
.done-wrap p { margin: 0; color: var(--y-2); font-size: 13px; }
.foot { flex: none; padding: 8px 14px 22px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(to top, rgba(0,0,0,.9) 60%, rgba(0,0,0,0)); }
.kb { flex: none; height: 150px; background: #2b2b2f; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px 6px 20px; }
.kb i { background: #6b6b6f; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 15px; color: #fff; }
/* formulario de siempre (miniatura) */
.formmini { display: flex; flex-direction: column; gap: 8px; }
.formmini .sec { font-size: 10px; text-transform: uppercase; color: var(--y-2); letter-spacing: .04em; padding: 0 4px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: #111; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.fallback { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 30; display: grid; place-items: center; padding: 16px; }
.fallback > div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: min(640px, 100%); display: flex; flex-direction: column; gap: 10px; }
.fallback textarea { width: 100%; height: 50vh; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
.fallback button { align-self: flex-end; border: 0; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; }
.clear-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; }

const RESUMEN_HTML = () => {
  const rows = INVENTORY.filter(f => f.v === 'yes').map(f => { const fl = FLOWS.find(x => x.id === f.flow); return `<tr><td class="order">${fl.order}</td><td><a href="#f-${fl.id}">${esc(fl.name)}</a><div class="inv-meta">${esc(fl.entry)}</div></td><td><span class="pill yes">Convertir</span></td><td>${esc(fl.value)}</td><td>${esc(fl.effort)}</td><td>${esc(fl.fieldsNow)}</td></tr>`; }).join('');
  const others = INVENTORY.filter(f => f.v !== 'yes').map(f => `<tr><td></td><td>${esc(f.name)}</td><td><span class="pill ${f.v === 'later' ? 'later' : 'no'}">${f.v === 'later' ? 'Más adelante' : 'Se queda'}</span></td><td colspan="3">${esc(f.why)}</td></tr>`).join('');
  return `<section class="view">
  <div><div class="eyebrow">Exploración · 15 de noviembre</div><h1>¿Qué formularios pasan a guiado?</h1>
  <p class="lede">Siete de los veintiún formularios de crear y editar de Yala ganan con un guiado como el de Primeros pasos: una pregunta por pantalla, la tarjeta que se llena arriba y «Usar formulario» siempre a mano. Los demás se quedan como están porque se usan a diario, ya vienen rellenos o son de un solo dato. Cada maqueta cubre todos los campos del formulario de hoy, sin quitar ninguno: las preguntas que proponemos saltar llevan «Propuesta» en «Se salta si».</p></div>
  <div class="block"><h2>Orden recomendado</h2>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Flujo</th><th>Veredicto</th><th>Valor</th><th>Esfuerzo</th><th>Hoy</th></tr></thead><tbody>${rows}${others}</tbody></table></div></div>
  <div class="block"><h2>El criterio</h2><div class="cards">
    <div class="note"><b>Guiado: crear algo que se hace pocas veces</b><p>Cuenta, pago, presupuesto, grupo, favorito, categoría. Son decisiones con jerga o con campos que dependen de otros, y la persona no tiene el formulario en la memoria.</p></div>
    <div class="note"><b>Formulario: lo diario y lo que ya viene relleno</b><p>Nuevo registro, gasto de grupo, saldar, guardar como favorito. Ahí un guiado añade toques, no claridad.</p></div>
    <div class="note"><b>Editar siempre abre el formulario</b><p>Quien edita quiere cambiar un dato concreto y verlo todo. El guiado es solo para crear.</p></div>
  </div></div>
  <div class="block"><h2>Lo que comparten los siete guiados</h2><div class="prose"><ul>
    <li><b>«Usar formulario» arriba a la derecha</b>, en cada pregunta y en la confirmación. Lo ya respondido pasa al formulario. Si se toca, ¿Yala lo recuerda para la próxima? Está por decidir.</li>
    <li><b>Una pregunta por pantalla</b>, con la tarjeta de lo que se está creando arriba, llenándose. Lo que ya se sabe no se pregunta (una sola moneda, una sola cuenta, sin grupos, sin etiquetas).</li>
    <li><b>Confirmación «Revisa antes de crear»</b> con cada respuesta y «Cambiar» al lado. Primeros pasos no la tiene: va directo a «¡Lista!».</li>
    <li><b>Éxito con el siguiente paso</b>: ver lo creado o crear otro. En grupo, invitar.</li>
    <li>Las piezas son las de Primeros pasos: <code>TutorialQuestionScreen</code>, <code>TutorialOptionButton</code>, <code>TutorialSelectableTile</code>, <code>TutorialChip</code>, <code>TutorialToggleRow</code> y <code>TutorialAmountField</code>.</li>
  </ul></div></div>
  <div class="block"><h2>Un solo motor con Yala IA</h2><div class="prose">
    <p>Hay en cola una sesión que hará un motor de guiados dentro de Yala IA para presupuestos y pagos recurrentes. Estas maquetas están escritas para ese mismo motor: cada pregunta es un dato (texto, tipo de respuesta, valor por defecto, cuándo se salta, qué campo llena). Con una sola definición por flujo salen las dos formas: a pantalla completa desde el «+» y como conversación dentro del chat. Por eso el orden empieza por pago y presupuesto justo después de cuenta: lo que construya esa sesión es la base de los siete.</p>
    <p>No encontré el encargo de esa sesión en esta máquina. Si su motor no sigue este contrato, el primer paso es acordarlo con ella.</p></div></div>
  <div class="block"><h2>Lo que te toca decidir</h2><div class="prose"><ul>
    <li>Las preguntas marcadas «Propuesta: saltar»: número de cuenta y «cuenta en tus reportes» (cuenta), nota (pago y favorito), necesidad (presupuesto, favorito), ícono y «menos pagos» (grupo), fecha (deuda de antes), «usar al registrar» (categoría).</li>
    <li>¿El «+» abre siempre el guiado, o solo las primeras veces y después el formulario?</li>
    <li>Dos ideas nuevas que no existen hoy: «Son unas cuotas» en el fin de un pago, y «Registrarlo ahora» al crear un favorito.</li>
  </ul></div></div>
  <div class="block"><h2>Encontrado por el camino (no se tocó)</h2><div class="prose"><ul>
    <li>Una cuenta nueva arranca siempre en soles (PEN), no en la moneda principal de la persona.</li>
    <li>El color de la cuenta tiene su sección escrita en el formulario, pero ninguna parte la enseña.</li>
    <li>El editor de pagos calcula las próximas fechas y no las pinta en ningún sitio.</li>
    <li>«Guardar como favorito» no dice nada si falla al guardar.</li>
    <li>La línea personalizada del flujo de caja acepta monto 0 o texto que no es número.</li>
    <li>«Metas» no existe en Yala: no hay formulario que convertir.</li>
  </ul></div></div>
  ${cmtBox('resumen', 'Comentario sobre la recomendación')}
  </section>`;
};

function renderCard(c) {
  if (!c) return '';
  const nm = c.name ? `<b>${esc(c.name)}</b>` : `<b class="ph">${esc(c.namePh || 'Sin nombre')}</b>`;
  const ty = c.type ? `<span>${esc(c.type)}</span>` : `<span class="ph">${esc(c.typePh || 'Tipo')}</span>`;
  const amt = c.amount != null
    ? `<div class="amt"><small>${esc(c.amountLabel || 'Saldo')}</small>${esc(c.amount)}</div>`
    : (c.amountLabel ? `<div class="amt"><small>${esc(c.amountLabel)}</small><span class="ph">—</span></div>` : '');
  const bar = c.bar != null ? `<div class="bar"><i style="width:${c.bar}%"></i></div>` : '';
  const lines = (c.lines || []).length ? `<div class="lines">${c.lines.map(l => `<i>${esc(l)}</i>`).join('')}</div>` : '';
  return `<div class="ycard"><div class="top1"><div class="ico" style="background:${c.color || '#3a3a3c'}">${svg(c.icon || 'question')}</div><div class="nm">${nm}${ty}</div></div>${amt}${bar}${lines}</div>`;
}
/* La tarjeta de arriba se llena con las respuestas: base del flujo + los primeros `fill` parches. */
function cardFor(flow, s) {
  if (!flow.cardBase) return null;
  const c = Object.assign({}, flow.cardBase, { lines: [...(flow.cardBase.lines || [])] });
  (flow.cardSeq || []).slice(0, s.fill || 0).forEach(p => {
    const { addLines, ...rest } = p;
    Object.assign(c, rest);
    if (addLines) c.lines.push(...addLines);
  });
  return c;
}
function renderDock(items) {
  return (items || []).map(d => {
    switch (d.t) {

      case 'tiles': return `<div class="tiles" style="grid-template-columns:repeat(${d.cols || 3},1fr)">${d.items.map(o => `<div class="tile" style="${o.on ? `box-shadow:inset 0 0 0 2px ${o.c}` : ''}"><div class="circ" style="background:${o.c}">${svg(o.ic)}</div><b>${esc(o.ti)}</b>${o.cap ? `<span>${esc(o.cap)}</span>` : ''}${o.on ? `<div class="chk" style="background:${o.c}">${svg('check')}</div>` : ''}</div>`).join('')}</div>`;
      case 'chips': return `${d.label ? `<div class="lbl">${esc(d.label)}</div>` : ''}<div class="chips">${d.items.map(o => `<span class="chip${o.on ? ' on' : ''}">${esc(o.ti || o)}</span>`).join('')}</div>`;
      case 'amount': return `${d.label ? `<div class="lbl">${esc(d.label)}</div>` : ''}<div class="field"><div class="input"><span class="sym">${esc(d.sym || 'S/')}</span>${d.val ? `<span class="val">${esc(d.val)}</span><span class="caret"></span>` : `<span class="caret"></span><span class="ph">${esc(d.ph || '0.00')}</span>`}</div>${d.noSend ? '' : `<div class="send${d.val ? '' : ' off'}">${svg('up')}</div>`}</div>`;
      case 'text': return `${d.label ? `<div class="lbl">${esc(d.label)}</div>` : ''}<div class="field"><div class="input">${d.val ? `<span class="val txt">${esc(d.val)}</span><span class="caret"></span>` : `<span class="caret"></span><span class="ph">${esc(d.ph || '')}</span>`}</div>${d.noSend ? '' : `<div class="send${d.val ? '' : ' off'}">${svg('up')}</div>`}</div>`;
      case 'toggle': return `<div class="tog"><div class="tx"><b>${esc(d.ti)}</b>${d.hint ? `<span>${esc(d.hint)}</span>` : ''}</div><div class="sw${d.on ? ' on' : ''}"></div></div>`;
      case 'row': return `<div class="row2"><span>${esc(d.l)}</span>${d.em ? `<em>${esc(d.v)}</em>` : `<b>${esc(d.v)}</b>`}</div>`;
      case 'days': { const sel = d.sel || 0; let h = '<div class="days">'; for (let i = 1; i <= 31; i++) h += `<i class="${i === sel ? 'on' : ''}">${i}</i>`; return h + '</div>'; }
      case 'week': return `<div class="days">${['L','M','M','J','V','S','D'].map((x, i) => `<i class="${i === d.sel ? 'on' : ''}">${x}</i>`).join('')}</div>`;
      case 'seg': return `<div class="seg">${d.items.map((x, i) => `<i class="${i === d.sel ? 'on' : ''}">${esc(x)}</i>`).join('')}</div>`;
      case 'list': return `${d.label ? `<div class="lbl">${esc(d.label)}</div>` : ''}<div class="list">${d.items.map(o => `<div class="li">${o.av ? `<div class="av" style="background:${o.c || '#5856d6'}">${esc(o.av)}</div>` : (o.ic ? `<div class="ic" style="color:${o.c || 'var(--y-accent-text)'};width:20px">${svg(o.ic)}</div>` : '')}<div class="tx"><b>${esc(o.ti)}</b>${o.su ? `<span>${esc(o.su)}</span>` : ''}</div>${o.rt ? `<div class="rt${o.acc ? ' acc' : ''}">${esc(o.rt)}</div>` : ''}</div>`).join('')}</div>`;
      case 'palette': return `<div class="palette">${d.items.map((c, i) => `<i style="background:${c}" class="${i === d.sel ? 'on' : ''}"></i>`).join('')}</div>`;
      case 'icons': return `<div class="icons">${d.items.map((k, i) => `<i class="${i === d.sel ? 'on' : ''}">${svg(k)}</i>`).join('')}</div>`;
      case 'primary': return `<div class="primary${d.off ? ' off' : ''}">${esc(d.ti)}</div>`;
      case 'link': return `<div class="textlink">${esc(d.ti)}</div>`;
      case 'hint': return `<div class="hint${d.warn ? ' warn' : ''}">${esc(d.ti)}</div>`;
      case 'bubble': return `<div class="bubble">${esc(d.ti)}</div>`;
      case 'sum': return `<div class="sum">${d.rows.map(r => `<div class="sr"><span>${esc(r[0])}</span><b>${esc(r[1])}</b>${r[2] === false ? '' : '<em>Cambiar</em>'}</div>`).join('')}</div>`;
      case 'lbl': return `<div class="lbl">${esc(d.ti)}</div>`;
      default: return '';
    }
  }).join('');
}
function renderPhone(flow, s, i) {
  const qScreens = flow.screens.filter(x => x.kind === 'q');
  const qi = qScreens.indexOf(s);
  const total = qScreens.length;
  const sub = s.sub || flow.chatSubtitle;
  const showForm = s.kind === 'q' || s.kind === 'confirm';
  const hdr = `<div class="hdr"><div class="gbtn">${svg(s.kind === 'done' ? 'x' : 'back')}</div><div class="ttl"><b>Yala</b><span>${esc(sub)}</span></div>${showForm ? `<div class="useform">${svg('form')}Usar formulario</div>` : ''}</div>`;
  const dots = s.kind === 'q' ? `<div class="dots" aria-hidden="true">${qScreens.map((_, k) => `<i class="${k <= qi ? 'on' : ''}"></i>`).join('')}</div>` : (s.kind === 'confirm' ? `<div class="dots" aria-hidden="true">${qScreens.map(() => '<i class="on"></i>').join('')}</div>` : '');
  let inner = '';
  if (s.kind === 'done') {
    inner = `<div class="body"><div class="done-wrap"><div class="big">${svg('check')}</div><h4>${esc(s.q)}</h4><p>${esc(s.d || '')}</p>${s.card ? `<div style="width:100%;text-align:left">${renderCard(s.card)}</div>` : ''}</div></div><div class="foot">${renderDock(s.foot)}</div>`;
  } else if (s.kind === 'form') {
    inner = `<div class="body"><div class="formmini">${renderDock(s.dock)}</div></div>`;
  } else {
    const card = s.card === false ? '' : renderCard(s.card || cardFor(flow, s));
    inner = `<div class="body">${card}<div><div class="q">${esc(s.q)}</div>${s.d ? `<div class="qd">${esc(s.d)}</div>` : ''}</div><div class="dock">${renderDock(s.dock)}</div></div>${s.foot ? `<div class="foot">${renderDock(s.foot)}</div>` : ''}${s.kb ? `<div class="kb">${'1 2 3 4 5 6 7 8 9 . 0 ⌫'.split(' ').map(k => `<i>${k}</i>`).join('')}</div>` : ''}`;
  }
  return `<div class="phone" aria-label="Pantalla ${i + 1} de ${esc(flow.name)}"><div class="scr"><div class="sb"><span>9:41</span><span class="isl"></span><span class="bat"><i></i></span></div>${hdr}${dots}${inner}</div></div>`;
}

/* ===================== COMENTARIOS ===================== */
const STORE_KEY = 'yala-formularios-guiados-v1';
let comments = {};
try { comments = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { comments = {}; }
function saveComments() { try { localStorage.setItem(STORE_KEY, JSON.stringify(comments)); } catch (e) { /* sin almacenamiento: se queda en memoria */ } }
const filled = v => typeof v === 'string' && v.trim().length > 0;
function countFor(prefix) { return Object.keys(comments).filter(k => (k === prefix || k.startsWith(prefix + '/')) && filled(comments[k])).length; }
function updateCounts() {
  document.getElementById('totalCount').textContent = Object.values(comments).filter(filled).length;
  document.querySelectorAll('[data-count]').forEach(el => { const n = countFor(el.dataset.count); el.textContent = n ? n : ''; });
}
function cmtBox(key, label) {
  const v = comments[key] || '';
  return `<div class="cmt${filled(v) ? ' has' : ''}"><label for="c-${esc(key)}">${esc(label)}</label><textarea id="c-${esc(key)}" data-key="${esc(key)}" placeholder="Quitar, cambiar el texto, reordenar…">${esc(v)}</textarea></div>`;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('textarea[data-key]')) {
    comments[t.dataset.key] = t.value;
    t.parentElement.classList.toggle('has', filled(t.value));
    saveComments(); updateCounts();
  }
});
function allCommentsText() {
  const out = [];
  const add = (head, key) => { if (filled(comments[key])) out.push(`${head}\n  → ${comments[key].trim().replace(/\n/g, '\n    ')}`); };
  out.push('COMENTARIOS · Formularios guiados de Yala');
  add('[General] Resumen y recomendación', 'resumen');
  INVENTORY.forEach(f => add(`[Inventario] ${f.name}`, 'inv/' + f.id));
  FLOWS.forEach(flow => {
    const before = out.length;
    add(`[${flow.name}] Sobre el flujo entero`, flow.id + '/general');
    flow.screens.forEach((s, i) => {
      const head = `[${flow.name}] Pantalla ${i + 1} · ${s.label || s.q}`;
      add(head, `${flow.id}/${s.id}`);
      (s.subq || []).forEach(sq => add(`${head} · Pregunta: ${sq.q}`, `${flow.id}/${s.id}/${sq.id}`));
    });
    if (out.length === before) return;
  });
  if (out.length === 1) out.push('(Sin comentarios todavía)');
  return out.join('\n\n');
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
document.getElementById('copyAll').addEventListener('click', () => {
  const text = allCommentsText();
  const fallback = () => {
    const w = document.createElement('div'); w.className = 'fallback';
    w.innerHTML = `<div><b>Copia este texto</b><textarea readonly></textarea><button type="button">Cerrar</button></div>`;
    w.querySelector('textarea').value = text; document.body.appendChild(w);
    const ta = w.querySelector('textarea'); ta.focus(); ta.select();
    w.querySelector('button').onclick = () => w.remove();
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Comentarios copiados'), fallback);
    else fallback();
  } catch (e) { fallback(); }
});

function specHTML(flow, s, i) {
  const rows = [];
  if (s.spec) {
    if (s.spec.campo) rows.push(['Cubre', s.spec.campo]);
    if (s.spec.tipo) rows.push(['Respuesta', s.spec.tipo]);
    if (s.spec.def) rows.push(['Por defecto', s.spec.def]);
    if (s.spec.salta) rows.push(['Se salta si', s.spec.salta]);
    if (s.spec.nota) rows.push(['Nota', s.spec.nota]);
  }
  const subs = (s.subq || []).map(sq => cmtBox(`${flow.id}/${s.id}/${sq.id}`, `Comentario sobre «${sq.q}»`)).join('');
  const kindLbl = { q: 'Pregunta', confirm: 'Confirmación', done: 'Éxito', form: 'Formulario' }[s.kind] || '';
  return `<div class="spec"><div class="spec-title"><span class="idx">${String(i + 1).padStart(2, '0')}</span><h3>${esc(s.label || s.q)}</h3><span class="pill lvl">${kindLbl}</span></div>${rows.length ? `<dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>` : ''}${cmtBox(`${flow.id}/${s.id}`, s.subq ? 'Comentario sobre esta pantalla' : (s.kind === 'q' ? 'Comentario sobre esta pregunta' : 'Comentario sobre esta pantalla'))}${subs}</div>`;
}
function flowView(flow) {
  const mode = viewMode[flow.id] || 'all';
  const head = `<div class="flow-head"><div><div class="eyebrow">Maqueta · orden ${flow.order}</div><h1>${esc(flow.name)}</h1><p class="lede">${esc(flow.summary)}</p></div>
    <div class="flow-facts"><span class="pill lvl">${esc(flow.entry)}</span><span class="pill yes">Valor ${esc(flow.value)}</span><span class="pill later">Esfuerzo ${esc(flow.effort)}</span><span class="pill no">${flow.screens.filter(s => s.kind === 'q').length} preguntas · ${flow.fieldsNow}</span></div>
    ${flow.notes ? `<div class="cards">${flow.notes.map(n => `<div class="note"><b>${esc(n[0])}</b><p>${esc(n[1])}</p></div>`).join('')}</div>` : ''}
    ${cmtBox(flow.id + '/general', 'Comentario sobre el flujo entero')}
    <div class="mode" role="group" aria-label="Cómo ver las pantallas"><button type="button" data-mode="all" class="${mode === 'all' ? 'on' : ''}">Todas las pantallas</button><button type="button" data-mode="walk" class="${mode === 'walk' ? 'on' : ''}">Recorrer una a una</button></div></div>`;
  let body;
  if (mode === 'walk') {
    const i = Math.min(walkIndex[flow.id] || 0, flow.screens.length - 1);
    const s = flow.screens[i];
    body = `<div class="walk"><div class="walk-nav"><button type="button" data-step="-1" ${i === 0 ? 'disabled' : ''}>‹ Anterior</button><span>${i + 1} / ${flow.screens.length}</span><button type="button" data-step="1" ${i === flow.screens.length - 1 ? 'disabled' : ''}>Siguiente ›</button></div><div class="screen-row" style="border:0;padding:0">${renderPhone(flow, s, i)}${specHTML(flow, s, i)}</div></div>`;
  } else {
    body = `<div class="screens">${flow.screens.map((s, i) => `<div class="screen-row">${renderPhone(flow, s, i)}${specHTML(flow, s, i)}</div>`).join('')}</div>`;
  }
  return `<section class="view" data-flow="${flow.id}">${head}${body}</section>`;
}
function render() {
  const h = (location.hash || '#resumen').slice(1);
  const cur = h === 'inventario' || h.startsWith('f-') ? h : 'resumen';
  document.getElementById('nav').innerHTML = navHTML(cur);
  const main = document.getElementById('main');
  if (cur === 'resumen') main.innerHTML = RESUMEN_HTML();
  else if (cur === 'inventario') main.innerHTML = INVENTARIO_HTML();
  else { const f = FLOWS.find(x => 'f-' + x.id === cur); main.innerHTML = f ? flowView(f) : RESUMEN_HTML(); }
  updateCounts();
  const on = document.querySelector('.nav a.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) { const id = m.closest('[data-flow]').dataset.flow; viewMode[id] = m.dataset.mode; render(); return; }
  const st = e.target.closest('[data-step]');
  if (st) { const id = st.closest('[data-flow]').dataset.flow; const f = FLOWS.find(x => x.id === id); walkIndex[id] = Math.max(0, Math.min(f.screens.length - 1, (walkIndex[id] || 0) + Number(st.dataset.step))); render(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
