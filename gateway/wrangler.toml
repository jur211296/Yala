# Yala Gateway — Cloudflare Worker (Workers Paid)
# Proxy seguro a OpenAI + tasas de cambio. Las API keys reales viven SOLO aquí (wrangler secret).
#
# ⚠️ OWNER (task #7): tras crear la cuenta y los recursos, completar los <PLACEHOLDER>.
#   - account_id:    Cloudflare dashboard → Workers → account ID
#   - database_id:   `npx wrangler d1 create yala-gateway-staging`
#   - kv id:         `npx wrangler kv namespace create KV`
#   - APPLE_TEAM_ID: Apple Developer → Membership → Team ID
# Secrets (NO van aquí): `npx wrangler secret put OPENAI_API_KEY` (y EXCHANGE_RATE_API_KEY,
#   JWT_SIGNING_SECRET, DEV_SHARED_SECRET, APP_STORE_API_KEY). Ver README.

name = "yala-gateway-staging"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "86c270a7776be98639700bd5959b303b"

# ---------- STAGING (default) — acepta env App Attest "development" + DEV_SHARED_SECRET ----------
[vars]
ENVIRONMENT = "staging"
ENFORCE = "observe"                         # "observe" (cuenta, no bloquea) | "enforce"
APPLE_TEAM_ID = "3WKFFVD66J"
APPLE_BUNDLE_IDS = "com.jurgenschmidt.yala.dev"
ATTEST_ENV = "development"
TRUST_ATTESTED_AS_PRO = "true"   # SOLO staging — QA del chat sin suscripción real. Prod NO lo setea.
# Modo Nube (I6) — Supabase STAGING. URL + anon key son públicos (no secretos); el JWT del USUARIO
# viaja en Authorization y RLS es el árbitro. NUNCA service_role.
SUPABASE_URL = "https://fostjbbwstyuunmmefuk.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvc3RqYmJ3c3R5dXVubW1lZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTAxNTMsImV4cCI6MjA5OTAyNjE1M30.gTWg5a8NKNuL_RhOmaaSGhnJpdV6iMXhwYwZVJb-FKg"

[[d1_databases]]
binding = "DB"
database_name = "yala-gateway-staging"
database_id = "6f76834b-62b4-4ec4-bb4f-db974b60f2ee"

[[kv_namespaces]]
binding = "KV"
id = "66bcbb46d628488d97a309f212df3e72"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ---------- PRODUCTION — acepta SOLO env App Attest "production", nunca DEV_SHARED_SECRET ----------
[env.production]
name = "yala-gateway-production"

[env.production.vars]
ENVIRONMENT = "production"
ENFORCE = "enforce"                         # enforce activo (rate-limit por device); rollback → "observe" + redeploy
APPLE_TEAM_ID = "3WKFFVD66J"
APPLE_BUNDLE_IDS = "com.jurgenschmidt.yala"
ATTEST_ENV = "production"
TRUST_ATTESTED_AS_PRO = "false"   # EXPLÍCITO: jamás Pro-trust en prod (cierra el trap; prod exige suscripción real)
# Modo Nube — Supabase PRODUCTION (proyecto kefvaiymtgytemwbltlz, org yala-production plan Pro,
# us-east-1; creado 2026-07-11, DIFERIDOS #23). URL + anon key son públicos (no secretos); el JWT
# del USUARIO viaja en Authorization y RLS es el árbitro. NUNCA service_role.
SUPABASE_URL = "https://kefvaiymtgytemwbltlz.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZnZhaXltdGd5dGVtd2JsdGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTg0MDYsImV4cCI6MjA5OTM3NDQwNn0.H8P3-kNUjeK8CTNZHwhfkqwqeflrNXLGvNa7OGGXkAk"

[[env.production.d1_databases]]
