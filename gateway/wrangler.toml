APPLE_TEAM_ID = "3WKFFVD66J"
APPLE_BUNDLE_IDS = "com.jurgenschmidt.yala.dev"
ATTEST_ENV = "development"
TRUST_ATTESTED_AS_PRO = "true"   # SOLO staging — QA del chat sin suscripción real. Prod NO lo setea.
# Modo Nube (I6) — Supabase STAGING. URL + anon key son públicos (no secretos); el JWT del USUARIO
# viaja en Authorization y RLS es el árbitro. NUNCA service_role.
SUPABASE_URL = "https://fostjbbwstyuunmmefuk.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvc3RqYmJ3c3R5dXVubW1lZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTAxNTMsImV4cCI6MjA5OTAyNjE1M30.gTWg5a8NKNuL_RhOmaaSGhnJpdV6iMXhwYwZVJb-FKg"
# APNs (spike G0 Grupos→backend). Key ID de 10 chars (no secreto); vacío = /v1/debug/push responde 503.
# El secret se sube con:  npx wrangler secret put APNS_AUTH_KEY < AuthKey_<KEYID>.p8
# (stdin preserva los saltos de línea del PEM; SIN --env: staging es el env default). NUNCA commitear la .p8.
APNS_KEY_ID = "7H6BUZWKKS"
# SIWA (B1, revoke 5.1.1(v)). Key ID de la .p8 de Sign in with Apple (no secreto — viaja en el kid del
# client_secret). El secret par: npx wrangler secret put SIWA_AUTH_KEY < AuthKey_PQ53RQ5D3G.p8
SIWA_KEY_ID = "PQ53RQ5D3G"
# Remote-config del cliente (GET /config, DIFERIDOS #34): percents de rollout 0-100, fail-closed
# (ausente/inválido → 0). STAGING sirve 100 en los 3: el dogfooding/QA DEV no pierde superficie y el
# e2e ejercita el camino real. Flip sin release del cliente = editar aquí + `npx wrangler deploy`.
CLOUD_MODE_ROLLOUT_PERCENT = "100"
CLOUD_ONBOARDING_CHOICE_ROLLOUT_PERCENT = "100"
GROUPS_BACKEND_ROLLOUT_PERCENT = "100"
# Forzado de actualización (min-version): build por debajo del cual el cliente bloquea. 0 = desactivado.
# STAGING también en 0 a propósito: un valor > 0 BLOQUEARÍA la app de dogfooding/QA (≠ percents, que
# encienden superficie). Se sube conscientemente al probar el flujo end-to-end.
MIN_SUPPORTED_BUILD = "0"

[[d1_databases]]
binding = "DB"
database_name = "yala-gateway-staging"
database_id = "6f76834b-62b4-4ec4-bb4f-db974b60f2ee"

[[kv_namespaces]]
binding = "KV"
id = "66bcbb46d628488d97a309f212df3e72"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Telemetría propia mínima (POST /metrics, 2026-07-17): ping diario / registros / canarios.
# Dataset SEPARADO por env (staging no contamina las series de prod). Retención AE: 90 días.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "yala_metrics_staging"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ---------- PRODUCTION — acepta SOLO env App Attest "production", nunca DEV_SHARED_SECRET ----------
[env.production]
name = "yala-gateway-production"

[env.production.vars]
