  - id: marca-aproximado-sobre-lo-mostrado
    area: dinero
    titulo: "La marca «≈» es del número que se pinta, y su proporción usa el denominador mostrado."
    disparador:
      rutas: ["Yala/*.swift", "YalaWidgets/*.swift"]
      simbolos: [ApproximateMarkThreshold, approximateMagnitude, periodBalanceIsApproximate, convertedIsApproximate, hasApproximateRow]
      patrones: ['isEstimate:', '"≈']
    comprobacion: >-
      El numerador suma |dudoso|; el denominador es el valor mostrado (en una resta, su valor absoluto). La señal
      va por lado; la etiqueta de accesibilidad lleva `isEstimate`. El test discrimina: dos importes iguales no dan
      el mismo veredicto con las dos reglas.
    pruebas: [ApproximateMarkPanelCoherenceTests, ApproximateAmountMarkTests, GroupBridgeApproximateMarkTests]
    origen:
      - {fecha: "2026-09-09", ref: "PR #111", que: "la marca no llegaba a las superficies secundarias"}
      - {fecha: "2026-09-09", ref: "PR #113", que: "el gasto de grupo perdía la marca de sus patas"}
      - {fecha: "2026-10-12", ref: "commit f6c68cc18", que: "dos criterios de aproximado en la misma pantalla"}
    regla: [".claude/rules/currency-fx.md:190-248"]
    ultimo_disparo: null

  # ─────────────────────────────────── Fechas y períodos ───────────────────────────────────

  - id: periodo-que-cierra-en-medianoche
    area: fechas
    titulo: "Un período que termina donde empieza el siguiente cuenta la medianoche del día 1 en los dos lados."
    disparador:
      rutas: ["Yala/*.swift", "YalaWidgets/*.swift"]
      patrones: ['DateInterval\(start:', 'byAdding:\s*\.second,\s*value:\s*-1', 'dateComponents\(\[\.day\]']
    comprobacion: >-
      Si el `end` coincide con el `start` de otro período, se resta 1 s (condicional: `startOfDay(for: end) == end`),
      en TODAS las ramas del switch; antes de contar días se normaliza `end + 1 s`. El caso trae una transacción a
      las 00:00:00 del día 1.
    pruebas: [PreviousPeriodHelperTests, AlignedPreviousIntervalMidnightTests, BudgetPeriodIntervalTests, PeriodEndsBeforeTomorrowMidnightTests, DetailPeriodDateIntervalTests, DateIntervalDayCountTests]
    origen:
      - {fecha: "2026-07-02", ref: "commit cd30951e8", que: "Mes y Año pasado incluían la medianoche del día 1 actual"}
      - {fecha: "2026-09-02", ref: "commit 80f2cad51", que: "la transacción del día 1 contaba dos veces en la rama de este mes"}
      - {fecha: "2026-10-09", ref: "PR #416", que: "en presupuestos el gasto del día 1 contaba en el período anterior"}
      - {fecha: "2026-10-25", ref: "PR #631", que: "los períodos en curso contaban lo fechado mañana a las 00:00"}
    regla: ["CLAUDE.md:46-50"]
    ultimo_disparo: null

  - id: saldo-filas-que-entran
    area: fechas
    titulo: "Un saldo nuevo decide qué filas entran con `entersBalance` (con cuenta) y `TodayCutoff` (hasta hoy)."
    disparador:
      rutas: ["Yala/*.swift", "YalaWidgets/*.swift"]
      simbolos: [TodayCutoff, entersBalance, countsForWidgets]
      patrones: ['\bdate\s*<=?\s*(now|Date\(\))']
    comprobacion: >-
      Todo saldo nuevo pasa por `TodayCutoff` y `entersBalance`, no por `<= now` ni por `interval.contains`; la
      salud financiera es la excepción (`asOf: .distantFuture`). La cifra y su curva cuentan las mismas filas.
    pruebas: [BalanceFutureDatedCutoffTests, WidgetBalanceAccountlessParityTests]
    origen:
      - {fecha: "2026-10-19", ref: "PR #556", que: "la cifra contaba filas futuras que la curva no dibuja"}
      - {fecha: "2026-10-23", ref: "PR #612 (widget)", que: "la cifra del widget contaba filas sin cuenta y no casaba con su curva"}
    regla: [".claude/rules/currency-fx.md:117-133", ".claude/rules/ingreso-gasto.md:67-75"]
    ultimo_disparo: null

  # ─────────────────────────────── Formulario de Nuevo registro ───────────────────────────────

  - id: nuevo-registro-cambia-de-alto
