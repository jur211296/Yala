    ultimo_disparo: null

  - id: borrador-sobrevive-a-la-hoja
    area: formulario
    titulo: "Quien presenta Nuevo registro guarda lo escrito fuera de la hoja, o el formulario vuelve a 0.00."
    disparador:
      rutas: ["Yala/*.swift"]
      simbolos: [NewRecordDraft, newRecordSheetIdentity]
      patrones: ['NewTransactionView\(']
    comprobacion: >-
      Con el formulario a medias y una entrada externa (enlace, foto, voz) o la hoja rehecha, el importe se
      conserva. Una pantalla nueva que presente `NewTransactionView` le pasa `draft:`.
