  - id: ingreso-o-gasto-en-un-sitio
    area: dinero
    titulo: "Ingreso o gasto se decide en un solo sitio (manda la categoría; sin categoría, el signo) y se suma con signo."
    disparador:
      rutas: ["Yala/*.swift", "YalaWidgets/*.swift"]
