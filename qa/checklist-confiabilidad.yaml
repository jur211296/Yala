    comprobacion: >-
      Se usa `TransactionClassificationLogic.isIncome`. El fixture de paridad trae las dos filas que separan las
      reglas: sin categoría de cada signo, y de signo contrario a su categoría. Mutar y exigir rojo.
    pruebas: [IncomeExpenseScreenParityTests, CategoryBreakdownUncategorizedTests, PanelBudgetPlanningParityTests, DailySpendingCalculatorTests]
    origen:
      - {fecha: "2026-09-02", ref: "commit 0b85f075e", que: "el calendario de Registros clasificaba por signo y no por categoría"}
      - {fecha: "2026-10-23", ref: "PR #612", que: "el mismo mes salía con cuatro pares de cifras"}
      - {fecha: "2026-10-24", ref: "PR #615", que: "tartas y rankings sin el trozo «Sin categoría»"}
      - {fecha: "2026-10-29", ref: "PR #683", que: "Yala IA y el conector daban el movimiento sin categoría como gasto"}
