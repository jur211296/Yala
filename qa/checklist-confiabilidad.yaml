    titulo: "Las dos rutas de conversión dan lo mismo con los mismos datos, y una tasa inservible cuenta como ausente."
    disparador:
      rutas: ["Yala/Services/CurrencyConverter.swift", "Yala/Services/ExchangeRateService.swift", "Yala/Utils/CurrencyUtils.swift", "Yala/Services/CurrencyChangeService.swift"]
    comprobacion: >-
      Mutar el cambio y exigir rojo en `bothRoutesAgree`. El fixture construye fila parcial, fila de ayer y tasa
      cero; todo camino nuevo que lea tasas pasa por `CurrencyConverter.isUsableRate`.
    pruebas: [CurrencyConverterLatestRateQualityTests, CurrencyConverterPartialRateTests, CurrencyConverterDailyFactorsTests, CurrencyConverterTests]
    origen:
      - {fecha: "2026-09-03", ref: "commit 85ba00774", que: "una tasa que faltaba contaba como 1:1 y se sellaba como oficial"}
      - {fecha: "2026-09-06", ref: "PR #84", que: "el saldo en pantalla contaba 1000 yenes como 1000 soles"}
      - {fecha: "2026-11-06", ref: "PR #840", que: "la tasa de hoy que llegaba por iCloud no se usaba al momento"}
    regla: [".claude/rules/currency-fx.md:18-71"]
    ultimo_disparo: null

  - id: importe-convertido-cero
    area: dinero
    titulo: "Un `amountInPreferredCurrency == 0` con `amount != 0` es una conversión sin escribir, no un importe real."
    disparador:
      rutas: ["Yala/App/Logic/*.swift", "Yala/App/ViewModels/*.swift", "Yala/Services/*.swift", "YalaWidgets/*.swift"]
      simbolos: [amountInPreferredCurrency]
    comprobacion: >-
      Un calculador nuevo que lea `amountInPreferredCurrency` pasa por `resolvedAmount` o `readsStoredAmount` y suma
      un caso a `StatisticsCalculatorsZeroConvertedTests`; una pata ajustada se pregunta con `isAdjusted`, nunca
      comparando importes.
    pruebas: [StatisticsCalculatorsZeroConvertedTests]
    origen:
      - {fecha: "2026-10-11", ref: "PR #460", que: "un gasto de grupo con una pata sin convertir salía entero"}
      - {fecha: "2026-10-11", ref: "PR #461", que: "un movimiento sin convertir contaba 0 en Yala IA"}
      - {fecha: "2026-10-12", ref: "PR #465", que: "tartas y rankings contaban 0 un movimiento sin conversión"}
      - {fecha: "2026-10-14", ref: "commit 3ac321f8f", que: "el detalle pintaba «≈ 0,00»"}
