# Checklist de confiabilidad de Yala (P4 de la propuesta de verificación del 17-nov-2026).
#
# Qué es: las lecciones de lógica cara (nube, migraciones, dinero, fechas, formulario de registro, el
# puente de Grupos y las pruebas que un PR rompe sin que su gate las corra) destiladas de las reglas de
# prosa, cada una con lo que tiene que aparecer en un diff para que importe. Un script (segunda parte de
# P4) elegirá los ítems que toca un PR y se los dará a un revisor con el diff. Las reglas de
# `.claude/rules/` siguen siendo la fuente larga: aquí va solo el disparador, la comprobación y por qué.
#
# Cómo se dispara un ítem (contrato para el selector):
#   - `rutas`: globs tipo fnmatch sobre las rutas del diff; `*` cruza carpetas. Acotan DÓNDE.
#   - `simbolos`: identificadores, como palabra entera; `patrones`: regex de Python. Acotan QUÉ, y se
#     buscan en el texto de las líneas añadidas o quitadas (sin el `+`/`-`) de los ficheros que pasaron
#     el filtro de `rutas`.
#   - Se dispara si (no hay `rutas` o alguna casa) Y (no hay `simbolos` ni `patrones` o alguno casa).
#
# Reglas para entrar (y para quedarse):
#   - el disparador se ve en un diff;
#   - `origen` trae al menos DOS incidentes o PRs distintos. Dos PRs cuentan como dos si arreglan el
#     patrón en sitios distintos del código, aunque uno lo encontrara el barrido del otro. NO cuentan: el
#     mismo fallo parcheado y luego arreglado de raíz, el PR que introdujo la función, ni un origen cuyo
#     diff no trata el patrón del título;
#   - no lo vigila ya una prueba automática (eso no necesita revisor);
#   - `pruebas` nombra tipos o ficheros de prueba que existen; `regla` apunta a las líneas de la prosa;
#   - `ultimo_disparo` lo rellena el selector; lo que no se dispare en 90 días se revisa (P5).
# Banco: `bash qa/scripts/checklist-confiabilidad-test.sh` (forma + que todo lo nombrado exista).
# Documento: `docs/verificacion/checklist-confiabilidad.md`.
version: 1
items:

  # ─────────────────────────── Nube: sync personal y de Grupos ───────────────────────────

  - id: lectura-fallida-no-es-vacio
    area: nube
    titulo: "Una lectura que falla o se corta no se lee como «no hay nada»."
    disparador:
      rutas: ["Yala/Services/CloudSync/*.swift", "Yala/Services/Groups/GroupService.swift", "Yala/App/Logic/WelcomeAccountChoiceLogic.swift", "Yala/Services/iCloudSyncService.swift"]
      patrones: ['try\?', '\bcatch\b', '\?\?\s*(\[\]|0|nil)\b', '\b(fetch|find)\w*\(', '\.isEmpty\b']
    comprobacion: >-
      Si la lectura falla, el código lanza, deshace y deja el cursor quieto; no inserta, no borra, no hashea ni
      decide «no hay datos» como si la tabla estuviera vacía. Un `find*`/`fetch*` nuevo del sync trae su caso con
      el seam `_testThrowOnFetchOf`.
    pruebas: [SyncApplyEngineTests, DrainUnitClockUnreadableTests, SyncMerkleTests, PrefsOutboxTests, ApplyPageBatchLookupTests]
    origen:
      - {fecha: "2026-08-03", ref: "commit b1a9333da", que: "salir de todos los grupos daba por salido lo que no pudo leer"}
      - {fecha: "2026-09-20", ref: "commit 1db8d53dd", que: "el tope de la búsqueda de iCloud se leía como «no hay datos»"}
      - {fecha: "2026-09-22", ref: "PR #211", que: "el verify leyó un fetch fallido como outbox vacío"}
      - {fecha: "2026-09-26", ref: "PR #271", que: "el outbox de preferencias ilegible se pisaba"}
      - {fecha: "2026-10-06", ref: "PR #378", que: "una muestra ilegible de la vuelta esperaba 72 h"}
    regla: [".claude/rules/swiftdata-cloudkit.md:394-430", ".claude/rules/swiftdata-cloudkit.md:602-658", ".claude/rules/swiftdata-cloudkit.md:1128-1136", ".claude/rules/swiftdata-cloudkit.md:2080-2097"]
    ultimo_disparo: null

  - id: cierre-sin-perder-lo-pendiente
    area: nube
    titulo: "Un cierre o «Empezar de cero» no borra lo local sin haber subido o materializado lo pendiente."
    disparador:
      rutas: ["Yala/Services/CloudSync/*.swift", "Yala/Utils/DataWipeService.swift", "Yala/App/Logic/CloudSignOutFlowLogic.swift", "Yala/App/Logic/PrivateSignOutExportGateLogic.swift"]
      simbolos: [captureLocalWritesForExit, captureGroupsForExit, hasUncapturedPersonalChanges, purgeHistoryOnce, pushAllForSignOut, drainOnce, armSignOutWipe, performSignOutWipeIfArmed, deleteLocalGroupsRows, InboundCaptureDrain, outboxSaveAuthor]
      patrones: ['\bwipe\w*\(', '\bpurge\w*\(', 'context\.delete\(']
    comprobacion: >-
      Un gesto nuevo que borre el outbox, el espejo o filas pasa por `captureLocalWritesForExit` /
      `captureGroupsForExit`; con el motor abierto el outbox a 0 no prueba nada; no se borran filas con el espejo
      montado; los recuentos de un cierre pasan por `pendingCountMaterializingInbound`.
    pruebas: [CloudSyncRuntimeTests, GroupsDrainFailureReadsAsPendingTests, PrivateExitInboundCaptureTests, SignOutWipeHookTests, CloudSignOutFlowLogicTests]
    origen:
      - {fecha: "2026-09-25", ref: "PR #250", que: "el push-all del cierre corría un ciclo saltándose el candado del motor"}
      - {fecha: "2026-09-26", ref: "PR #256", que: "«Empezar de cero» mataba escrituras de grupo sin subir"}
      - {fecha: "2026-09-26", ref: "PR #257", que: "un drain de Grupos a medias se leía «nada pendiente» al borrar"}
      - {fecha: "2026-09-26", ref: "PR #269", que: "el cierre privado perdía capturas de Apple Pay y Siri sin materializar"}
    regla: [".claude/rules/swiftdata-cloudkit.md:334-393", ".claude/rules/swiftdata-cloudkit.md:484-532", ".claude/rules/swiftdata-cloudkit.md:1802-1804"]
    ultimo_disparo: null

  - id: hlc-sendlocal-y-orden-de-subida
    area: nube
    titulo: "El drain estampa con `sendLocal(eventTime:)` y sube en orden de HLC, no con `send(now:)`."
    disparador:
      rutas: ["Yala/Services/CloudSync/*.swift"]
      simbolos: [HLCClock, sendLocal, observePulled, uploadOrder]
      patrones: ['\.send\(now:', 'max\([^)]*timestamp[^)]*,\s*now']
    comprobacion: >-
      Ningún camino del drain llama a `clock.send(now:)` (los tres usos de snapshot y remap son a propósito); la
      subida usa `HLC.uploadOrder` y los pulls integran con `observePulled`. Todo HLC guardado queda acotado a
      `now() + 60 s`.
    pruebas: [PersonalClockRollbackDrainTests, GroupsClockRollbackDrainTests, ClockAheadServerCapTests]
    origen:
      - {fecha: "2026-09-26", ref: "PR #259", que: "el reloj por delante encallaba el drain de Grupos para siempre"}
      - {fecha: "2026-10-07", ref: "commit a1b7297c5", que: "un teléfono con la hora adelantada ganaba todos los conflictos"}
    regla: [".claude/rules/swiftdata-cloudkit.md:533-592"]
    ultimo_disparo: null

  - id: columna-de-sync-declara-since
    area: nube
    titulo: "Una columna nueva de sync lleva `since` en el manifest de su canal, o diverge el Merkle de los teléfonos viejos."
    disparador:
      rutas: ["capability_manifest.json", "group_capability_manifest.json", "Yala/Services/CloudSync/*Capability*.swift", "Yala/Services/CloudSync/*EmissionMap.swift", "Yala/Services/CloudSync/DeltaEmitter.swift", "Yala/Services/CloudSync/EntityApplyMap.swift"]
    comprobacion: >-
      La columna declara `since` en el manifest de su canal (no en el emisor de Grupos), sube la versión, y el
      drain de Grupos pasa `capabilityLevel: GroupsSyncCapability.declaredLevel`. Si una columna no opcional
      emite el default como NULL, mirar su applier.
    pruebas: [GroupsCapabilityManifestParityTests, CloudCapabilityManifestParityTests, GroupsNextColumnPiecesTests, CreditCardCycleSyncTests]
    origen:
      - {fecha: "2026-10-18", ref: "commit 968335ddb", que: "una columna a secas divergía el Merkle en teléfonos viejos"}
      - {fecha: "2026-10-24", ref: "PR #623", que: "Grupos sin cabecera de capability apagaba el Merkle del parque viejo"}
    regla: [".claude/rules/swiftdata-cloudkit.md:184-193"]
    ultimo_disparo: null

  - id: campo-de-modelo-es-campo-de-cloudkit
    area: nube
    titulo: "Una propiedad nueva en un `@Model` sincronizado por CloudKit es un campo que Production no crea solo."
    disparador:
      rutas: ["Yala/Models/*.swift", "Cloudkit Schemas/yala*.ckdb"]
      patrones: ['^\s*(@\w+\s+)*(public\s+)?var\s+\w+', '^\s*CD_\w+\s+[A-Z]']
    comprobacion: >-
      La paridad de los `.ckdb` ya la exige `PersonalCloudKitSchemaParityTests`. Lo que queda a mano: el despliegue
      del esquema a Production va ANTES de publicar el build que escribe el campo
      (`docs/cloudkit-schema-diff-2.1.md`). Un modelo del store de Grupos (`cloudKitDatabase: .none`) no aplica.
    pruebas: [PersonalCloudKitSchemaParityTests]
    origen:
      - {fecha: "2026-06-27", ref: "commit 9f64e02c1", que: "«isOpeningBalance» entró sin desplegar el esquema: el sync de Grupos quedó muerto cuatro días"}
      - {fecha: "2026-10-10", ref: "PR #442", que: "faltaban 14 campos en el esquema de producción y 31 en el de desarrollo"}
    regla: [".claude/rules/swiftdata-cloudkit.md:180-183"]
    ultimo_disparo: null

  - id: drain-y-apply-sin-tablas-enteras
    area: nube
    titulo: "El drain y el apply corren en el hilo principal y no leen tablas enteras ni buscan fila a fila."
    disparador:
      rutas: ["Yala/Services/CloudSync/CloudSyncEngine.swift", "Yala/Services/CloudSync/Groups/GroupsSyncClient.swift", "Yala/Services/CloudSync/EntityApplyMap.swift", "Yala/Services/CloudSync/SyncApplyEngine.swift"]
      simbolos: [performDrain, assignMissingSyncIDs, entitiesToTranslate, existingOutboxKeys, prepareLookups, applyPage]
      patrones: ['FetchDescriptor<\w+>\(\)']
    comprobacion: >-
      Ninguna lectura nueva de tabla entera en el drain ni en el ciclo; el apply de una página busca por lote
      (`prepareLookups`). Una escritura nueva dentro de la página se apunta (`noteInserted`) o hace `forget`.
    pruebas: [DrainIndexesOnlyWhatItTranslatesTests, ApplyPageBatchLookupTests]
    origen:
      - {fecha: "2026-10-31", ref: "PR #723", que: "la app se congelaba segundos en el drain (YALA-IOS-2)"}
      - {fecha: "2026-11-13", ref: "commit b3e31c700", que: "el apply buscaba fila a fila, 4 s por página (YALA-IOS-J)"}
    regla: [".claude/rules/swiftdata-cloudkit.md:2004-2022", ".claude/rules/swiftdata-cloudkit.md:2080-2097"]
    ultimo_disparo: null

  - id: token-nil-no-es-sesion-caducada
    area: nube
    titulo: "Un token que no llega no es sesión caducada; se pregunta `canRenewSession` en todos los clientes."
    disparador:
      rutas: ["Yala/Services/CloudSync/*Client.swift", "Yala/Services/CloudSync/BornCloudSignUpService.swift"]
      simbolos: [canRenewSession, sdkRemovedTheSession, accessToken, sessionExpired]
    comprobacion: >-
      `canRenewSession` se lee DESPUÉS de pedir el token y en los cinco clientes, más `sdkRemovedTheSession` y
      `GroupsMembershipClient.call`. Los tests inyectan `canRenewSession: { false }`, no `hasSession`.
    pruebas: [SupabaseSessionRenewalContractTests]
    origen:
      - {fecha: "2026-09-15", ref: "commit 6428e1462", que: "el canal de Grupos llamaba caducada a una sesión viva sin red"}
      - {fecha: "2026-09-16", ref: "PR #188", que: "el canal personal leía el refresh sin red como sesión caducada"}
      - {fecha: "2026-09-22", ref: "PR #209", que: "el Merkle, el último cliente en copiar el criterio"}
    regla: [".claude/rules/swiftdata-cloudkit.md:1812-1814"]
    ultimo_disparo: null

  - id: signout-se-verifica
    area: nube
    titulo: "Que `signOut()` vuelva no prueba que la sesión se fue; la sesión que abrió un intento se cierra al salir de él."
    disparador:
      rutas: ["Yala/Services/CloudSync/*.swift", "Yala/App/Logic/CloudSignOutFlowLogic.swift"]
      simbolos: [closeSessionIfOpened, sessionIsGone]
      patrones: ['\.signOut\(']
    comprobacion: >-
      `closeSessionIfOpened` es el único `signOut` del controller. Un cierre nuevo que arme el borrado comprueba
      el valor de retorno antes del arm y se añade a los `arguments:` de su test.
    pruebas: [SignOutChecksTheSessionBeforeArmingTests, SupabaseSignOutContractTests, AdoptSessionOwnershipTests]
    origen:
      - {fecha: "2026-09-23", ref: "PR #230", que: "la sesión del adopt sobrevivía a su salida"}
      - {fecha: "2026-09-26", ref: "PR #255", que: "el desasociar no verificaba que la sesión se cerrara"}
    regla: [".claude/rules/swiftdata-cloudkit.md:1404-1441", ".claude/rules/swiftdata-cloudkit.md:1837-1863"]
    ultimo_disparo: null

  - id: frontera-de-persona-no-hereda
    area: nube
    titulo: "Al cambiar de persona en el teléfono no sobrevive nada de la anterior: sesión, sello, consent, preferencias ni grupos."
    disparador:
      rutas: ["Yala/Services/CloudSync/CloudSessionRetirement.swift", "Yala/Services/CloudSync/CloudClaimActionStore.swift", "Yala/Utils/DataWipeService.swift", "Yala/App/Logic/CloudSignOutFlowLogic.swift", "Yala/Services/Groups/GroupsOnlySignUpPreferenceReset.swift", "Yala/Utils/SwiftDataConfiguration.swift", "Yala/App/Logic/CrossAccountEntryGuardLogic.swift"]
      simbolos: [CloudSessionRetirement, retireForSignOutWipe, forgetAllClaims, recordOwner, removeUserPreferenceKeys, PrefSyncKey]
      patrones: ['PreferenceSyncService\S*\.(remove|set)\(']
    comprobacion: >-
      Toda frontera nueva (cierre, empezar de cero, reinstalar, entrar por un grupo) retira la sesión y olvida el
      sello en `CloudSessionRetirement.arm`, antes del arm; limpia preferencias y consent donde el modo ya es
      `.icloud` o solo en local con `PrefSyncKey.allCases`, nunca con `remove` y la nube viva.
    pruebas: [CloudSessionRetirementTests, SignOutWipeHookTests, SignOutNotificationWiringTests]
    origen:
      - {fecha: "2026-07-21", ref: "commit bdbc46d1e", que: "el consent de grupos sobrevivía al borrado del cierre en Modo Nube"}
      - {fecha: "2026-07-27", ref: "commit 31dded30d", que: "el usuario nuevo heredaba los grupos y los gastos del anterior"}
      - {fecha: "2026-09-17", ref: "PR #192", que: "la sesión de la persona anterior sobrevivía a empezar de cero y reinstalar"}
      - {fecha: "2026-09-29", ref: "PR #298", que: "otra cuenta entraba sobre el corpus y el outbox de la primera"}
      - {fecha: "2026-10-01", ref: "PR #317", que: "quien entraba por un grupo heredaba las preferencias del dueño"}
    regla: [".claude/rules/swiftdata-cloudkit.md:1746-1746", ".claude/rules/swiftdata-cloudkit.md:1766-1768", ".claude/rules/swiftdata-cloudkit.md:1963-1984"]
    ultimo_disparo: null

  # ───────────────────────────────── Puente de Grupos ─────────────────────────────────

  - id: borrados-que-conservan-grupos
    area: dinero
    titulo: "Un borrado de datos personales que conserva los grupos pide la convergencia del puente ANTES de borrar."
    disparador:
      rutas: ["Yala/*.swift"]
      simbolos: [wipeAllUserData, wipePersonalDataKeepingGroups, wipeLocallyForRemoteWipeSignal, markSettlementLegsPending, GroupsBridgeRestoreConvergenceStore]
    comprobacion: >-
      `markSettlementLegsPending()` y `markPending()` salen antes del borrado en los dos aterrizajes; el receptor de
      la señal solo pide si su borrado se lleva lo repuesto (corte por `createdAt` contra `lastWipeTimestamp`).
    pruebas: [GroupsBridgeRestoreConvergenceTests, RemoteWipeCutTests, RemoteWipeSignalWiringTests, UsageModeFreshStartWipeTests]
    origen:
      - {fecha: "2026-09-27", ref: "PR #282", que: "«Empezar desde cero» perdía las patas de liquidación de grupo"}
      - {fecha: "2026-09-27", ref: "PR #283", que: "tras «Vaciar datos» los gastos de grupo desaparecían de lo personal"}
      - {fecha: "2026-09-27", ref: "PR #287", que: "el receptor tardío de la señal borraba lo repuesto y nadie lo pedía"}
    regla: [".claude/rules/swiftdata-cloudkit.md:1865-1875"]
    ultimo_disparo: null

  - id: puente-materializa-lo-que-llega
    area: dinero
    titulo: "Un gasto de grupo que llega, se borra o se une por el canal crea o quita su registro personal sin relanzar."
    disparador:
      rutas: ["Yala/Services/Groups/GroupTransactionBridge*.swift", "Yala/Services/Groups/GroupExpenseService.swift", "Yala/Services/Groups/GroupService.swift", "Yala/Services/CloudSync/Groups/*.swift", "Yala/App/Logic/BridgedEditPolicy.swift"]
    comprobacion: >-
      Cada camino por el que entra, cambia o se va un gasto de grupo (sync, canal nuevo, unirse, borrado remoto)
      deja el registro personal enlazado en el mismo ciclo, y lo pendiente sobrevive a un cierre de la app.
    pruebas: [GroupsPendingBridgeDurabilityTests, GroupRemoteDeletionUnbridgeTests, GroupJoinerIdentityConsumerTests]
    origen:
      - {fecha: "2026-07-30", ref: "commit ad9371481", que: "el gasto de grupo que llegaba por sync se quedaba sin registro personal"}
      - {fecha: "2026-08-02", ref: "commit 830516882", que: "quien recibía el borrado de un gasto se quedaba la transacción"}
      - {fecha: "2026-09-05", ref: "commit ac8880de8", que: "el gasto de quien acababa de unirse no llegaba a su cuenta sin relanzar"}
    regla: [".claude/rules/swiftdata-cloudkit.md:1754-1754", ".claude/rules/swiftdata-cloudkit.md:1772-1772"]
    ultimo_disparo: null

  - id: gasto-de-grupo-cuenta-mi-parte-una-vez
    area: dinero
    titulo: "Un gasto de grupo cuenta mi parte, y una sola vez, en toda cifra que sume registros."
    disparador:
      rutas: ["Yala/App/Logic/*.swift", "Yala/App/ViewModels/*.swift", "Yala/Services/*.swift", "YalaWidgets/*.swift"]
      simbolos: [GroupBridgeStatsAdjustment, BridgedTransactionFilter]
      patrones: ['\bgroupLeg\w*', 'isBridged\w*']
    comprobacion: >-
      Una suma nueva de registros pasa por `GroupBridgeStatsAdjustment` (mi parte, neta) y por
      `BridgedTransactionFilter`; ni la pata de grupo ni su borrador cuentan dos veces, tampoco con el puente
      apagado o una fila sin su grupo.
    pruebas: [GroupBridgeStatsAdjustmentTests, GroupBridgeStatsIntegrationTests, BridgedTransactionFilterTests]
    origen:
      - {fecha: "2026-06-09", ref: "commit 369f563c5", que: "con el puente apagado, aceptar el opt-in contaba el gasto dos veces"}
      - {fecha: "2026-07-23", ref: "commit 35fdde8d6", que: "los gastos de grupo que pagué contaban entero y no mi parte"}
      - {fecha: "2026-10-16", ref: "commit 6765a1722", que: "filas de grupo sin su grupo o su cuenta contaban doble"}
    regla: [".claude/rules/ingreso-gasto.md:77-81", ".claude/rules/session-filters.md:198-202"]
    ultimo_disparo: null

  # ───────────────────────────── Migración a la nube y vuelta ─────────────────────────────

  - id: guard-de-migracion-no-falla-abierto
    area: migracion
    titulo: "Un guard de algo destructivo no concede cuando no hay controller o el journal no se lee o no se entiende."
    disparador:
      rutas: ["Yala/*.swift"]
      simbolos: [migrationAtRest, currentPhaseRead, blockIfMigrationNotAtRest, isJournalUnreadable, isJournalUndecodable]
      patrones: ['\?\?\s*\.idle\b']
    comprobacion: >-
      Un guard nuevo no usa `(shared?.uiState ?? .idle)`: pasa por `AppleIDChangeCloseLogic.migrationAtRest` o lee
      el journal igual, y trata «ilegible» como no concedido. Un campo, blob o case nuevo del journal entra en
      `MigrationState.isJournalUndecodable`.
    pruebas: [MigrationJournalUnreadableTests, MigrationJournalUndecodableTests, PrivateSignOutMigrationGuardTests, AppleIDChangeCloseLogicTests, StorageJournalUnreadableUITests]
    origen:
      - {fecha: "2026-09-22", ref: "PR #215", que: "un journal ilegible se leía como «notStarted» y concedía"}
      - {fecha: "2026-09-27", ref: "PR #273", que: "el cambio de Apple ID se comprobaba antes de existir el controller"}
      - {fecha: "2026-09-27", ref: "PR #274", que: "el cierre privado borraba lo local con una migración en vuelo"}
    regla: [".claude/rules/swiftdata-cloudkit.md:230-333"]
    ultimo_disparo: null

  - id: esperas-de-migracion-con-techo
    area: migracion
    titulo: "Toda espera o reintento de la ida, el adopt o la vuelta lleva techo journaleado y una salida visible."
    disparador:
      rutas: ["Yala/Services/CloudSync/Migration*.swift", "Yala/Services/CloudSync/AdoptEffectProgress.swift", "Yala/Services/CloudSync/CloudMigrationController.swift"]
      simbolos: [CauseStallClock, observeAnyDefinitive, clearReversePreMountCeiling, clearReverseUploadCeiling]
      patrones: ['while\s+true', 'Task\.sleep', '\.transient\b']
    comprobacion: >-
      El paso nuevo declara qué reloj usa, qué evento lo reinicia, a qué motivo falla y qué pantalla muestra. Un
      campo de reloj nuevo se limpia en todos los sitios de su `clear…Ceiling` y es aditivo; el techo corto se mide
      con el reloj de lo definitivo, no con el de la causa.
    pruebas: [SnapshotUploadCeilingLogicTests, ForwardStepCeilingLogicTests, AdoptEffectCeilingLogicTests, ReverseUploadCeilingLogicTests, MigrationRunnerTests]
    origen:
      - {fecha: "2026-09-21", ref: "PR #199", que: "las fases previas al montaje de la vuelta no tenían salida"}
      - {fecha: "2026-09-22", ref: "PR #212", que: "la subida del snapshot se quedaba al 55 % sin techo"}
      - {fecha: "2026-09-23", ref: "PR #223", que: "causas definitivas alternando nunca llegaban al techo corto"}
      - {fecha: "2026-09-23", ref: "PR #226", que: "el efecto del adopt reintentaba para siempre"}
    regla: [".claude/rules/swiftdata-cloudkit.md:692-855", ".claude/rules/swiftdata-cloudkit.md:1445-1445", ".claude/rules/swiftdata-cloudkit.md:1472-1609"]
    ultimo_disparo: null

  - id: salir-de-fase-repone-pendientes
    area: migracion
    titulo: "Volver al origen desde una fase transitoria repone los efectos pendientes que la fase reemplazó."
    disparador:
      rutas: ["Yala/Services/CloudSync/MigrationStateMachine.swift", "Yala/Services/CloudSync/MigrationState.swift", "Yala/Services/CloudSync/MigrationRunner.swift"]
      simbolos: [ReverseOriginPendingEffects, ForwardOriginPendingEffects, reverseOriginPendingEffectsData]
      patrones: ['pendingEffects\s*=', '\.rearmMirrorOff', '\.reverseRollback', '\.completeReverseServer']
    comprobacion: >-
      Toda salida a una fase de origen repone el pendiente; el brazo que lo descarta exige salir de la fase
      (`next != .reverseClaimLeader`). Una ventana nueva que use `reverseOriginPendingEffectsData` prueba que no se solapa.
    pruebas: [ForwardOriginPendingEffectsTests, MigrationRunnerTests]
    origen:
