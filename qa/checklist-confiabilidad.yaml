    ultimo_disparo: null

  # ──────────────── Pruebas: las que un PR rompe sin que su gate las corra, o que no prueban ────────────────

  - id: tocar-tras-escribir-en-xcuitest
    area: pruebas
    titulo: "Una prueba que escribe el importe y luego toca algo debajo pierde el toque en el teclado o en la barra."
    disparador:
      rutas: ["YalaUITests/*.swift"]
      simbolos: [openSelectorFirstRow, dismissKeyboard, waitForSettledLayout]
      patrones: ['\.typeText\(']
    comprobacion: >-
      Tras `typeText` hay cierre de teclado (`dismissKeyboard`) o `openSelectorFirstRow`, y el caso afirma que el
      toque hizo lo esperado. Correr la clase tocada y, si es del formulario, la calculadora y el selector de tarjeta.
    pruebas: [SplitCalculatorUITests, AccountCardPickersUITests, EdgeCasesUITests]
    origen:
      - {fecha: "2026-10-09", ref: "PR #414", que: "el chip de cuenta estaba en y=716 al tocar y en y=513 al llegar"}
      - {fecha: "2026-11-09", ref: "PR #876", que: "«Calcúlalo conmigo» quedó bajo la barra y caía cada noche"}
      - {fecha: "2026-11-17", ref: "PR #1020", que: "«Mi parte» quedó bajo el teclado"}
    regla: [".claude/rules/testing.md:176-176", ".claude/rules/testing.md:215-227"]
    ultimo_disparo: null

  - id: aviso-deshacer-no-cabe-en-5s
    area: pruebas
    titulo: "Un XCUITest que toca el aviso con «Deshacer» tras otra espera no cabe en sus 5 s en el runner del CI."
    disparador:
      rutas: ["YalaUITests/*.swift"]
      patrones: ['Deshacer', '[Uu]ndo']
    comprobacion: >-
      Todo caso que lea o toque el aviso después de otra espera lanza con `-uitest-undo-notice-seconds 30`; antes de
      tocar algo bajo la cápsula, `waitForNonExistence` del aviso.
    pruebas: [UndoNoticePlacementUITests]
    origen:
      - {fecha: "2026-10-25", ref: "PR #631 (deshacer)", que: "el segundo borrado tardó más de 5,4 s"}
      - {fecha: "2026-10-29", ref: "PR #690", que: "seis pruebas caían cada noche en el CI y pasaban en local"}
    regla: [".claude/rules/testing.md:178-194"]
    ultimo_disparo: null

  - id: ahora-fijo-en-pruebas
    area: pruebas
    titulo: "Un test que construye «ahora» con el reloj o la zona del runner se rompe a ciertas horas o días."
    disparador:
      rutas: ["YalaTests/*.swift", "YalaUITests/*.swift"]
      patrones: ['(Date\(\)|Date\.now)\.addingTimeInterval\(', 'Calendar\.current\.(date|startOfDay|dateInterval)\(', 'TimeZone\.current', 'XCUIApplication\(\)\.launch\(']
    comprobacion: >-
      Si el SUT lee el reloj, `aMomentAgoToday()`; si acepta `now:`, un `now` fijo a mitad de mes. Correr con
      `TEST_RUNNER_TZ` a una zona donde sea 00:MM y con `Etc/GMT-12`. Los XCUITest lanzan con `launchForUITest`.
    pruebas: [FullFinancialContextBuilderTests]
    origen:
      - {fecha: "2026-10-08", ref: "commit 3d7f0e3c7", que: "los tests de períodos del widget dependían de la zona del runner"}
      - {fecha: "2026-11-01", ref: "commit 87a44f204", que: "doce casos caían a las 00:30 del día 1"}
      - {fecha: "2026-11-05", ref: "commit 788ae8061", que: "la app del simulador heredaba UTC y caían dos XCUITest"}
    regla: [".claude/rules/testing.md:132-150"]
    ultimo_disparo: null

  - id: defaults-aislados-en-pruebas
    area: pruebas
    titulo: "Un test no escribe en `UserDefaults.standard` ni crea dominios sueltos, o contamina a otras suites."
    disparador:
      rutas: ["YalaTests/*.swift"]
      patrones: ['UserDefaults\.standard\.(set|removeObject|register)\(', 'UserDefaults\(suiteName:', 'SessionState\.shared\.\w+\s*=']
    comprobacion: >-
      Lo añadido escribe con `makeIsolatedDefaults()` o `testDefaults(suiteName:)`, y lo que fija en
      `SessionState.shared` (p. ej. `isExpensesOnlyMode`) lo restaura en `defer`. Leer de `standard` no es el riesgo.
    pruebas: [AppPreferencesTests, TestSimulatorJanitorTests]
    origen:
      - {fecha: "2026-10-26", ref: "commit 8691e5844", que: "«solo gastos» se colaba entre suites y Registros perdía los ingresos"}
      - {fecha: "2026-11-04", ref: "PR #786", que: "1.262 ficheros de preferencias por corrida en el simulador"}
    regla: [".claude/rules/testing.md:76-76", ".claude/rules/testing.md:97-109"]
    ultimo_disparo: null
