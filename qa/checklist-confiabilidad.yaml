    disparador:
      rutas: ["Yala/App/Views/Transactions/NewTransactionView.swift", "Yala/App/Views/Transactions/Components/*.swift", "Yala/App/Views/Transactions/TransactionFormRow.swift", "Yala/App/Views/Transactions/NewRecordTutorialGuide.swift", "Yala/App/Models/TransactionFormModels.swift"]
    comprobacion: >-
      Correr, en iPhone 17 Pro y en SE, la calculadora, el selector de tarjeta, el formulario decidido, favoritos y
      los casos límite como mínimo; mirar que cada toque abra lo que pide y no caiga en «Guardar» ni en el teclado.
      En rojo, el vídeo del `.xcresult`.
