    ultimo_disparo: null

  - id: saldo-en-el-tiempo-por-divisa
    area: dinero
    titulo: "Un saldo pasado vale lo nativo de cada divisa por la tasa de ese día; el de una cuenta convierte sus filas ajenas."
    disparador:
      rutas: ["Yala/App/Logic/Calculators/BalanceValuation.swift", "Yala/App/Logic/Calculators/LiveBalanceCalculator.swift", "Yala/Services/TrendDataProcessor.swift", "Yala/Utils/AccountBalanceCalculator.swift", "Yala/Services/WidgetDataCache.swift"]
    comprobacion: >-
      Todo saldo pasado pasa por `BalanceValuation`; el punto de hoy sale de `convertAtLatestRate`. Si cambia
      `rateFactors`, cambia `resolveRates`. Caso con cuenta en USD, curva que acaba en su cifra y una fila en otra divisa.
    pruebas: [AccountBalanceCalculatorTests, CurrencyConverterDailyFactorsTests]
