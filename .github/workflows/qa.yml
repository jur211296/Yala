name: QA

on:
  push:
  pull_request:

jobs:
  # Barato y rápido: valida el SSOT de cobertura + el ratchet anti-drift.
  # Corre en Linux (solo necesita python3). Bloquea merge si el index regresa.
  coverage-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar coverage-index (ratchet anti-drift)
        run: python3 qa/validate-coverage.py

  # Red dura de "nada se rompe": YalaTests (pure-logic) + YalaUITests (regresión UI).
  # Runner macos-26 (Tahoe): trae Xcode 26.x (26.0.1–26.5) + sims iOS 26.2/26.4/26.5.
  # `latest-stable` toma el Xcode 26.x más nuevo del image (alineado con el dev local,
  # que va siempre con el último). macos-15 NO tiene Xcode 26.x (por eso fallaba antes).
  # Parallel=NO + retry para reducir flake/clones.
  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar Xcode (latest-stable 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Ejecutar tests (YalaTests + YalaUITests)
        run: |
          xcodebuild test \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaTests \
            -only-testing:YalaUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -quiet
