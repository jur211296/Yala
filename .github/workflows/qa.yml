name: QA

on:
  # El push solo vigila las ramas que sobreviven. Sin el filtro, una rama de ticket
  # disparaba DOS runs del mismo commit —uno por `push` y otro por `pull_request`— y cada
  # uno encola el runner de simulador. Medido el 2026-09-01 sobre un mismo commit: 97,4 min
  # (push) + 102,4 min (pull_request). El commit que se mergea lo vuelve a cubrir el push
  # sobre `2.1`, así que no se pierde cobertura: se deja de pagarla dos veces.
  push:
    branches: ["2.1", "1.0"]
  pull_request:
  # La suite de UI entera NO corre en el PR: corre aqui, una vez al dia sobre `2.1`
  # (decision del owner, 2026-09-06). El PR tiene que dar senal dentro de una sesion de
  # trabajo y no la daba — medido sobre 39 runs con la suite ejecutada (2026-09-06/07):
  # el job entero tardaba 89 min de mediana y el paso de UI se llevaba 67 de ellos, asi
  # que el check no cerraba nunca a tiempo y el patron real era mergear sin esperarlo.
  # Sin el paso de UI el PR baja a ~22 min. La cobertura no se pierde, se mueve: el gate
  # local ya corre los XCUITest de las areas tocadas antes de cada commit (paso 3 de
  # `/gate`, cruzando el diff contra los `codeGlobs` de `qa/coverage-index.json`), y esto
  # cubre la suite COMPLETA a diario.
  #
  # `schedule` corre sobre la rama por defecto del repositorio y no se puede elegir otra;
  # aqui la rama por defecto ES `2.1` (comprobado el 2026-09-07 con
  # `gh api repos/jur211296/Yala --jq .default_branch`), que es justo lo que se queria. Si
  # algun dia se cambia la rama por defecto, esta corrida se muda con ella sin avisar.
  #
  # El minuto 17 no es decorativo: los cron en punto son los mas congestionados de GitHub
  # y es cuando mas se retrasa el disparo. 08:17 UTC = 03:17 en Lima (UTC-5 todo el ano,
  # Peru no cambia la hora), asi que el resultado esta listo antes de que empiece el dia.
  #
  # UN APAGADO SILENCIOSO QUE CONVIENE CONOCER: en un repositorio PUBLICO —y este lo es,
  # comprobado el 2026-09-07— GitHub deshabilita solo los workflows programados cuando el
  # repo pasa **60 dias sin actividad**. Con la cadencia de hoy no va a ocurrir, pero si
  # algun dia esta corrida deja de aparecer sin que nadie la haya tocado, mirar ahi antes
  # que en el YAML: se reactiva desde Actions, o con `gh workflow enable qa.yml`.
  schedule:
    - cron: '17 8 * * *'
  # Para poder lanzar la nocturna a mano sin esperar a la noche — que es como se verifica
  # que funciona. Un dispatch manual corre EXACTAMENTE lo mismo que la nocturna, UI
  # incluida: si lo que quieres es repetir el CI normal de un commit, `gh run rerun`
  # conserva el evento original y no se traga la hora larga de UI.
  workflow_dispatch:

jobs:
  # Barato y rápido: valida el SSOT de cobertura + el ratchet anti-drift.
  # Corre en Linux (solo necesita python3). Bloquea merge si el index regresa.
  coverage-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar coverage-index (ratchet anti-drift)
        run: python3 qa/validate-coverage.py
      - name: Aislamiento de tests (makeTestContext( ⇒ .serialized)
        run: bash qa/check-test-isolation.sh
      # El candado que impide que un commit diga que lo escribió una IA vive en
      # `.githooks/commit-msg` (ADR-013; aquí es propio porque `core.hooksPath` local
      # sustituye al global, no se suma). Un candado sin banco de pruebas se relaja sin
      # que nadie lo note, así que sus 17 casos corren en cada push. La comparación con
      # el hook global se salta sola aquí: en el runner no hay ~/.claude.
      - name: Candado anti-atribución (.githooks/commit-msg)
        run: bash qa/scripts/commit-msg-test.sh
      # La cola del simulador (`sim-lock.sh`) y su centinela (`sim-libre.sh`). Mismo
      # argumento que el candado de arriba, y aquí pesa más: un lock roto NO da error — deja
      # correr dos sesiones a la vez y el daño sale tres horas después disfrazado de test en
      # rojo. El banco no toca ningún simulador ni compila nada: usa un `xcodebuild` de
      # mentira y, para sus casos, un lockfile propio bajo TMPDIR. Lo que sí pide es el turno
      # REAL mientras dura, porque esos procesos se llaman `xcodebuild` y el centinela de otra
      # sesión los vería; aquí el lock está siempre libre y no cuesta nada.
      - name: Cola del simulador (sim-lock.sh + sim-libre.sh)
        run: bash qa/scripts/sim-lock-test.sh

  # Suite del conector MCP de Claude (`mcp/`): typecheck y tests unitarios, sin red. Corre en
  # cada push, como `coverage-index`: es barata (Linux, segundos) y así un cambio de esquema que
  # rompa el MCP se ve en el mismo PR. Los e2e contra staging (`npm run test:e2e`) necesitan las
  # contraseñas de los usuarios de prueba y NO corren aquí.
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Decide si el job `tests` (macos-26, ~1,5 h de reloj) tiene algo que probar. Un
  # cambio de solo docs/tickets no puede romper el build ni la suite y hasta ahora
  # encolaba el runner de simulador igual: el PR #41 (3 ficheros .md) esperó 1 h 45 min.
  # El gate duro sigue siendo `coverage-index`, que corre siempre y no depende de esto.
  #
  # DENY-BY-DEFAULT: `run_tests=false` solo sale si TODOS los ficheros del diff caen en
  # el allowlist inerte de abajo. Todo lo demás corre — incluidos los casos en que NO
  # sabemos qué cambió: diff vacío, lista truncada por el tope de la API, push sin base
  # (rama nueva o historial reescrito), evento inesperado o fallo de red. Fail closed:
  # 1,5 h de más sale más barato que un verde que no probó nada.
  #
  # El allowlist se MIDIÓ contra el árbol (2026-08-28): ninguna de esas rutas aparece en
  # `Yala.xcodeproj/project.pbxproj` ni en las fuentes de los targets, así que no son
  # input de xcodebuild. Al añadir una ruta nueva, repetir la comprobación, no asumirla.
  # Repetida el 2026-09-01 al añadir `gateway/` y `qa/cloud/`:
  #   grep -c "gateway"        Yala.xcodeproj/project.pbxproj  → 0
  #   grep -cE "path = qa|qa/" Yala.xcodeproj/project.pbxproj  → 0
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - name: ¿El diff toca app, tests, proyecto o CI?
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Única salida posible cuando no hay certeza. Cualquier error no capturado
          # tumba el step, y el `if:` de `tests` también lee eso como "corre".
          run_suite() {
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Suite de simulador::CORRE — $1"
            exit 0
          }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') \
                || run_suite "la API de ficheros del PR no respondió"
              cap=3000
              ;;
            push)
              if [ -z "$PUSH_BASE" ] || [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
                run_suite "push sin commit base (rama nueva o historial reescrito)"
              fi
              # `compare A...B` ancla en el merge-base, así que un merge commit en 2.1
              # rinde todo lo que introduce el merge, no solo el segundo padre.
              changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BASE...$GITHUB_SHA" --jq '.files[]?.filename') \
                || run_suite "la API compare no respondió"
              cap=300
              ;;
            *)
              run_suite "evento $GITHUB_EVENT_NAME sin lista de ficheros fiable"
              ;;
          esac

          [ -n "$changed" ] || run_suite "el diff llegó vacío"
          echo "Ficheros del diff (primeros 50):"
          printf '%s\n' "$changed" | awk 'NR <= 50 { print "  " $0 }'

          total=0
          culprit=""
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            total=$((total + 1))
            case "$file" in
              docs/*|tickets/*|marketing/*|Web/*|.claude/*) ;;
              README.md|CLAUDE.md|LICENSE|LICENSE.md|LICENSE.txt) ;;
              # `gateway/` es el Worker de Cloudflare (TypeScript, su propia suite con
              # vitest) y `qa/cloud/` son scripts contra staging: ninguno entra en el build
              # de iOS. ACOTADO a `qa/cloud/` a proposito — `qa/scripts/` y
              # `qa/validate-coverage.*` SI deciden como se verifica el proyecto, asi que
              # siguen disparando la suite. Meter `qa/*` entero seria el error.
              gateway/*|qa/cloud/*) ;;
              # `mcp/` es el Worker del conector de Claude (TypeScript, su suite corre en el
              # job `mcp`). Medido el 2026-09-26: 0 apariciones en el project.pbxproj ni en las
              # fuentes de los targets.
              mcp/*) ;;
              *) culprit="$file"; break ;;
            esac
          done <<< "$changed"

          [ -z "$culprit" ] || run_suite "toca $culprit"
          # La API corta la lista de ficheros en `cap`; si la tocamos, el diff real
          # puede llevar código que no llegamos a ver.
          [ "$total" -lt "$cap" ] || run_suite "la API cortó la lista en $cap ficheros"

          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Suite de simulador::SE SALTA — el diff es solo docs/tickets/marketing (ficheros: $total)"

  # Suite de tests. Runner macos-26 (Tahoe): Xcode `latest-stable` (26.x) + sim
  # iPhone 17 Pro. Build UNA vez + test-without-building.
  #
  # ESTRATEGIA (2026-06-04 — TODO advisory; gate duro = coverage-index):
  #  (1) HOST CLOUDKIT CRASH (ARREGLADO, b25fc8c2): el host Yala.app arrancaba con CloudKit
  #      en sims SIN cuenta iCloud (CI) → NSCloudKitMirroringDelegate loop → proceso inestable.
  #      Fix: YALA_TEST_MODE + cloudKitDatabase .none + gate bootstrap/sync. Eliminó la cascada.
  #  (2) SwiftData IN-MEMORY EXC_BREAKPOINT (flaky en CI, NO resuelto): crash silencioso al
  #      instanciar/insertar @Model in-memory. NO se limita a las 7 clases que crean un
  #      ModelContext — TAMBIÉN tumba tests pure-logic que instancian @Model SIN contexto
  #      (Sankey/Insights/NewTransactionVM crean TransactionItem/Budget/Category). ALEATORIO por
  #      run: 26957612252 (f1575df7) pasó pure-logic limpio; 26963873224 (264e25f8, con pure-logic
  #      bloqueante) CRASHEÓ (cascade: NewTransactionVM/CurrencyDefaults víctimas in-flight,
  #      "TEST EXECUTE FAILED" sin ✘). -retry-tests-on-failure NO converge.
  #  (3) "Aislamiento de singletons" (hipótesis 2026-06-03) DESCARTADA: el run per-suite-a-solas
  #      probó que los fallos reproducibles del subset eran DETERMINISTAS = 7 tests STALE vs
  #      cambios INTENCIONALES de producto (regla Insights eliminada, Sankey tap-filter, seed
  #      Panel diferido, iCloud env). Arreglados en f1575df7 (subset verde local + en el run CI
  #      que no crasheó). El bloqueo NO lo impide el aislamiento sino el crash flaky (2).
  # Por (2) — flaky crash que ALCANZA al subset pure-logic — los 3 pasos siguen ADVISORY. El
  # intento de pure-logic BLOQUEANTE (264e25f8) se revirtió tras el crash de 26963873224. Gate
  # duro = coverage-index. Detalle en TESTING-STRATEGY.md.
  # TODO(@jur, 2026-07-15): resolver el EXC_BREAKPOINT SwiftData in-memory (repro mínima / bug
  # iOS 26.x sim / container compartido) — prerequisito para CUALQUIER paso de test bloqueante.
  tests:
    needs: changes
    # Fail closed también aquí: si `changes` peta, su output llega vacío y '' != 'false',
    # así que la suite corre igual. Solo un 'false' explícito la salta.
    if: ${{ !cancelled() && needs.changes.outputs.run_tests != 'false' }}
    runs-on: macos-26
    # ------------------------------------------------------------------------------
    # TOPES DE TIEMPO (2026-09-07). Sin `timeout-minutes` GitHub aplica su default de
    # **360 minutos**, y este job no tenia ninguno: ni aqui ni a nivel de workflow. El
    # problema que eso creaba no era el gasto sino el DIAGNOSTICO — un cuelgue real era
    # indistinguible de una corrida lenta, y nadie se enteraba hasta las seis horas.
    #
    # Los numeros salen de medir, no de estimar: 39 runs con la suite ejecutada
    # (2026-09-06/07), tiempos por PASO leidos de la API de Actions.
    #
    #   paso / conjunto          mediana    p95     max   tope
    #   Build for testing            9,7   11,9    13,7     25
    #   Unit pure-logic              8,9   13,2    17,0     30
    #   Unit context-based           2,4    3,1     3,5     10
    #   UI (solo nocturna)          67,2   75,5    76,2    110
    #   JOB en un PR (sin UI)       21,6   27,2    29,9     45
    #   JOB en la nocturna          88,9   99,5   101,7    150
    #
    # Los topes de JOB son ~1,5x el maximo observado; los de PASO, ~1,4-1,8x. Se ha
    # tirado hacia lo holgado a proposito: el coste de un tope generoso es una hora de
    # runner, y el de uno ceñido es cortar corridas sanas — que es como se acaba
    # quitando el tope y volviendo al punto de partida.
    #
    # POR QUE TAMBIEN EN CADA PASO, y no solo en el job. Los dos topes cortan, pero NO
    # producen el mismo desenlace, y la diferencia esta en el codigo del runner
    # (`StepsRunner.RunStepAsync` + `ExecutionContext.ApplyContinueOnError`, verificado el
    # 2026-09-07 contra `actions/runner` en `main`):
    #
    #   · Tope de PASO agotado ⇒ el paso queda `Failed`. `continue-on-error` SI rescata
    #     eso: lo pinta de `Succeeded` dejando `outcome: failure`, el job sigue con los
    #     pasos siguientes con normalidad y el aviso de abajo lo lee y lo cuenta.
    #   · Tope de JOB agotado ⇒ es una CANCELACION, no un fallo. `ApplyContinueOnError`
    #     abre con `if (Result != TaskResult.Failed) return;`, asi que **no rescata una
    #     cancelacion**: el paso en curso muere cancelado y el job entero se va con el.
    #
    # Los pasos con `if: always()` SI corren en ese segundo caso —el servidor re-evalua
    # las condiciones de los pasos pendientes y solo cancela los que dan `false`—, pero
    # contra una ventana de 5 minutos y con el job ya perdido. (Esto ultimo se comprobo
    # justo porque la primera version de este comentario afirmaba lo contrario: que el
    # aviso no llegaria. Era una inferencia, y la fuente la desmiente.)
    #
    # ⇒ los topes de PASO son el corte bueno: dicen QUE se colgo y dejan el job vivo para
    # contarlo. El del JOB es la red de debajo, para lo que se cuelgue fuera de estos
    # cuatro pasos, y su desenlace es mas tosco a proposito.
    #
    # `timeout-minutes` admite una expresion (comprobado con actionlint 1.7.12, que
    # rechaza el texto plano con «expecting a single ${{...}} expression or float number
    # literal»), y es lo que deja tener UN solo job en vez de dos casi identicos.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 150 || 45 }}
    # Los tests de intervalos construyen sus expectativas con un calendario fijado a
    # America/Lima, pero el SSOT que comparan (`DetailPeriod.dateInterval`) resuelve sus
    # fechas con `userConfiguredCalendar()` = `Calendar.current`. En la Mac del owner las
    # dos mitades coinciden y salen verdes; bajo otra zona no coinciden y salen CUATRO rojos
    # DETERMINISTAS —no flaky, categoria distinta del EXC_BREAKPOINT que justifica los
    # `continue-on-error` de mas abajo—. Llevaban asi desde el 2026-08-17.
    #
    # `TEST_RUNNER_` es el prefijo que `xcodebuild` retira al propagar la variable al proceso
    # de test, asi que el proceso recibe `TZ=America/Lima`. Medido el 2026-09-03 en la Mac del
    # owner con el mecanismo EXACTO de aqui —la variable en el ENTORNO del proceso xcodebuild,
    # que es como la entrega el `env:` de Actions, no en la linea de comandos—: con `UTC`,
    # `✘ Test run with 10 tests in 1 suite failed ... with 10 issues`; con `America/Lima`,
    # `✔ Test run with 10 tests in 1 suite passed`. Mismo binario, misma maquina, solo cambia
    # la variable. El conteo `10 tests` es el control de que la suite corrio y no cero tests.
    #
    # Sustituye a `sudo systemsetup -settimezone`, que estuvo aqui del 2026-09-02 al -09-03 y
    # se retiro por NO FIABLE: aplico la zona en 3 de 9 runs medidos, con la misma imagen de
    # runner y el mismo sudo. El `### Error:-99` de `InternetServices.m` que imprimia NO era la
    # causa —sale identico en los runs que SI aplicaron— y la causa ultima quedo sin cerrar.
    # Como el paso no era `continue-on-error`, cada fallo tumbaba el job entero y dejaba el CI
    # ejecutando CERO tests: cuatro commits de codigo entraron en 2.1 sin una sola corrida.
    # Va a nivel de JOB, no de paso, para que un paso de test nuevo lo herede — olvidarse de
    # aplicarlo es exactamente el modo de fallo que este bloque arregla.
    # Lo que el job del aviso necesita para leer que paso de verdad. `outcome` guarda lo
    # que devolvio el comando; `conclusion` es el que `continue-on-error` pinta de verde.
    outputs:
      unit_pure: ${{ steps.unit_pure.outcome }}
      unit_context: ${{ steps.unit_context.outcome }}
      ui: ${{ steps.ui.outcome }}
      ui_tocaba: ${{ steps.contexto.outputs.ui_tocaba }}
    env:
      TEST_RUNNER_TZ: America/Lima
      # Unica fuente de «esta corrida lleva UI». La gobierna el paso de UI (`if:`) y la
      # lee el JOB `aviso` de mas abajo para no confundir «saltado a proposito» con «no
      # llego a correr» — dos cosas que en `steps.<id>.outcome` se llaman IGUAL: `skipped`.
      # La condicion aparece dos veces en el fichero (aqui y en `timeout-minutes` del
      # job) porque el tope del job se evalua antes de que exista `env`. Si cambia una,
      # cambia la otra.
      UI_TOCABA: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      # `UI_TOCABA` sale por un paso, y no como `outputs: ui_tocaba: ${{ env.UI_TOCABA }}`,
      # porque el output de un paso es el camino sin ambiguedad: `steps.<id>.outputs` esta
      # disponible en `jobs.<id>.outputs` sin discusion. Lo medido con actionlint 1.7.12 es
      # que `env` SI se rechaza en `jobs.<id>.env` («context "env" is not allowed here») y
      # NO se queja en `jobs.<id>.outputs` — que no es lo mismo que saber que funciona en
      # ejecucion, y aqui un vacio haria que el aviso gritara «la suite no corrio» en cada
      # PR. Una linea de mas cuesta menos que averiguarlo en produccion.
      #
      # Lo que evita: que la condicion de UI_TOCABA se escriba una TERCERA vez en el fichero
      # (ya esta en el `env:` de este job y en su `timeout-minutes`).
      - name: Exponer si a la UI le tocaba correr
        id: contexto
        run: echo "ui_tocaba=$UI_TOCABA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Seleccionar Xcode (latest-stable 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Secrets.xcconfig está gitignored (API keys); sin él el build falla. El template
      # (placeholders) basta en CI: los tests no llaman APIs reales (LLM/exchange-rate
      # son agentic, fuera de CI).
      - name: Crear Secrets.xcconfig (placeholder para CI)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Build for testing
        timeout-minutes: 25
        run: |
          xcodebuild build-for-testing \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .ddp \
            -quiet
      # YalaTests SALVO las 7 clases que crean un ModelContext (paso advisory aparte). ADVISORY:
      # los 7 tests stale ya están arreglados (f1575df7) y el subset es determinista en lo
      # reproducible, PERO el EXC_BREAKPOINT flaky de SwiftData in-memory ALCANZA al subset
      # pure-logic (crashea ~1 de N runs — 26963873224 lo probó: cascade NewTransactionVM/
      # CurrencyDefaults). Bloquear aquí = rojos aleatorios. -retry no converge. Volver a
      # bloqueante exige resolver ese crash primero (TESTING-STRATEGY.md).
      - name: Unit tests (YalaTests pure-logic) — advisory (flaky crash SwiftData in-memory; ver Lista Negra)
        id: unit_pure
        continue-on-error: true
        timeout-minutes: 30
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaTests \
            -skip-testing:YalaTests/BudgetFilterRegressionTests \
            -skip-testing:YalaTests/CategoryDeduplicationServiceTests \
            -skip-testing:YalaTests/ChatAssistantViewModelTests \
            -skip-testing:YalaTests/CurrencyConverterCacheTests \
            -skip-testing:YalaTests/ICloudAccountSummaryTests \
            -skip-testing:YalaTests/InitialBalanceServiceTests \
            -skip-testing:YalaTests/UserSegmentServiceTests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure
      # ADVISORY: las 7 clases context-based (crean ModelContext in-memory). Corren para
      # visibilidad (cuando pasan confirman no-regresión); no bloquean por el insert-trap
      # flaky de SwiftData en el runner de CI. Plan de migración en TESTING-STRATEGY.md.
      - name: Unit tests (YalaTests context-based) — advisory (SwiftData insert-trap flaky; ver Lista Negra)
        id: unit_context
        continue-on-error: true
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaTests/BudgetFilterRegressionTests \
            -only-testing:YalaTests/CategoryDeduplicationServiceTests \
            -only-testing:YalaTests/ChatAssistantViewModelTests \
            -only-testing:YalaTests/CurrencyConverterCacheTests \
            -only-testing:YalaTests/ICloudAccountSummaryTests \
            -only-testing:YalaTests/InitialBalanceServiceTests \
            -only-testing:YalaTests/UserSegmentServiceTests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure
      # SOLO EN LA NOCTURNA (2026-09-06, decision del owner). La suite entera de UI, sin
      # paralelismo y con reintentos, tarda 67 min de mediana y 76 en el peor caso medido:
      # es el 76 % del reloj del job y la razon por la que el check de un PR no cerraba
      # dentro de una sesion de trabajo. En un PR este paso queda `skipped` a proposito.
      #
      # Lo que cubre el hueco en el PR es el gate local, que corre los XCUITest de las
      # areas TOCADAS antes de cada commit; aqui se corre la suite COMPLETA cada noche.
      # Sigue siendo advisory, por lo mismo que los dos de arriba.
      - name: UI tests (YalaUITests) — solo nocturna · advisory (flaky en runner frío, ver Lista Negra)
        id: ui
        if: ${{ env.UI_TOCABA == 'true' }}
        continue-on-error: true
        timeout-minutes: 110
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaUITests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure

  # --------------------------------------------------------------------------------
  # EL AVISO, EN SU PROPIO CHECK  (2026-09-09, decision del owner)
  #
  # POR QUE EXISTE EL AVISO. Los tres pasos de test llevan `continue-on-error` a
  # proposito —el EXC_BREAKPOINT de SwiftData in-memory haria rojos aleatorios, y volver
  # a bloqueante exige resolver ESE crash primero—, pero GitHub pinta de `success` un
  # paso asi aunque `xcodebuild` salga con 65. Medido el 2026-09-02: el CI llevaba
  # SEMANAS en verde con ocho tests en rojo, y el mas viejo databa del 17 de agosto. La
  # red funcionaba; estaba amordazada. Esto no promueve nada a bloqueante: hace que el
  # fallo DEJE RASTRO. Se lee `outcome`, no `conclusion`.
  #
  # POR QUE SALIO DEL JOB `tests`. Cuando el aviso vivia ahi dentro, su `exit 1` tumbaba
  # el job entero, y entonces un `tests: fail` mezclaba dos señales opuestas: «los tests
  # fallaron» y «los tests fueron bien pero el canal de avisos esta roto». Medido el
  # 2026-09-09 sobre las 40 ultimas corridas: los TRES rojos de `qa.yml` eran del
  # avisador, y dos tapaban señal real —la nocturna con la suite de UI en rojo, y un
  # `Build for testing` roto en `2.1`—. Quien mira un rojo asi puede concluir «es el
  # avisador otra vez» y mergear encima de un test que si fallaba, que es exactamente lo
  # que este mecanismo existe para impedir. Separado, cada check dice UNA cosa.
  #
  # Y ya no hace falta romper para no callar: si el webhook no responde, la accion deja
  # el aviso escrito en un issue del repo (etiqueta `aviso-ci`). Solo cuando no queda
  # ningun canal se pone en rojo — ahi si, porque entonces nadie se ha enterado.
  aviso:
    name: ¿Se ha enterado alguien de los rojos advisory?
    needs: tests
    # `!cancelled()` y NO `always()`, y la diferencia importa mucho: `always()` corre tambien
    # cuando el RUN ENTERO se cancela a mano. Este workflow no declara `concurrency`, asi que
    # los runs no se auto-cancelan y las cancelaciones son manuales — con un job de hasta 90
    # min en `macos-26`, cancelar al ver un typo es lo normal. Con `always()`, cada una de esas
    # veces `tests` acaba en `cancelled`, sus outputs llegan vacios, y esto entregaba a Grok
    # «la suite NO llego a correr — el job murio antes de los tests». No murio: lo cancelaste tu.
    #
    # `!cancelled()` mira si se cancelo el RUN, no si se cancelo `tests`. Asi que sigue
    # cubriendo el caso que si hay que avisar: el tope del job `tests` agotado, que es una
    # cancelacion DE ESE JOB con el run vivo. Ahi los outputs tambien llegan vacios y se leen
    # abajo como «no llego a correr», que es lo que se quiere. Es ademas el mismo operador que
    # ya usa el `if:` del job `tests`.
    #
    # Se excluye `skipped` a proposito: si `changes` decidio que el diff es solo docs, no
    # hay suite de la que informar y un aviso ahi seria ruido en cada PR de documentacion
    # — y un canal que grita cuando no pasa nada se acaba silenciando, que es el mismo
    # final que el canal mudo, por el otro extremo.
    if: ${{ !cancelled() && needs.tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # El canal de respaldo escribe un issue. El permiso por defecto de Actions en este
      # repo es `read`, asi que sin esta linea el respaldo no puede entregar nada.
      issues: write
    steps:
      # Hace falta para poder usar la action local `.github/actions/avisar`.
      - uses: actions/checkout@v4

      - name: ¿Hay algo que avisar?
        id: componer
        env:
          R_UNIT_PURE: ${{ needs.tests.outputs.unit_pure }}
          R_UNIT_CONTEXT: ${{ needs.tests.outputs.unit_context }}
          R_UI: ${{ needs.tests.outputs.ui }}
          UI_TOCABA: ${{ needs.tests.outputs.ui_tocaba }}
          RESULTADO_JOB: ${{ needs.tests.result }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          fallidos=""
          [ "$R_UNIT_PURE" != "failure" ]    || fallidos="$fallidos\n- Unit tests (pure-logic)"
          [ "$R_UNIT_CONTEXT" != "failure" ] || fallidos="$fallidos\n- Unit tests (context-based)"
          [ "$R_UI" != "failure" ]           || fallidos="$fallidos\n- UI tests (YalaUITests)"

          # Un paso advisory que no llego a EJECUTARSE deja `outcome` en `skipped`, no en
          # `failure`: el job murio en un paso ANTERIOR (setup, Secrets, build) y GitHub salto
          # los tres. Sin esta rama el aviso anunciaba "Suite en verde" sobre un run que ejecuto
          # CERO tests — el MISMO error de lectura que este bloque vino a arreglar, un escalon
          # mas arriba: comprobar el resultado de los tests sin comprobar antes que llegaran a
          # correr. Medido el 2026-09-03: seis runs seguidos en 2.1 asi, y el aviso callado.
          #
          # Desde que el aviso es un job aparte hay una tercera forma de no correr: que el job
          # `tests` fuera CANCELADO (tope de job agotado). Ahi sus outputs llegan VACIOS, que
          # tampoco es `success` ni `failure`, asi que cae en la misma rama. Es lo que se quiere.
          #
          # OJO (2026-09-07): desde que la UI corre SOLO en la nocturna, `skipped` significa
          # DOS cosas distintas y opuestas — "se salto a proposito" (todo bien) y "no llego a
          # correr" (nada bien). Distinguirlas exige mirar si a la UI le TOCABA correr, no su
          # `outcome`. Sin esto el aviso gritaria "la suite NO llego a correr" en CADA PR.
          sin_correr=""
          for r in "$R_UNIT_PURE" "$R_UNIT_CONTEXT"; do
            case "$r" in
              success|failure) ;;
              *) sin_correr="si" ;;
            esac
          done
          if [ "$UI_TOCABA" = "true" ]; then
            case "$R_UI" in
              success|failure) ;;
              *) sin_correr="si" ;;
            esac
          fi

          if [ -n "$sin_correr" ]; then
            asunto="la suite NO llego a correr"
            detalle=$(printf '%s\n' \
              "CI de $REPO ($RAMA): el job murio antes de los tests y la suite NO llego a correr." \
              "" \
              "Los pasos de test quedaron sin ejecutar (pure-logic: '$R_UNIT_PURE', context-based:" \
              "'$R_UNIT_CONTEXT', UI: '$R_UI' — a la UI le tocaba correr: '$UI_TOCABA'; el job" \
              "\`tests\` acabo en '$RESULTADO_JOB'). Un valor vacio significa que el job fue" \
              "CANCELADO y no llego a dejar resultado — casi siempre, su tope de tiempo." \
              "Esto NO es un verde: es un run que no probo nada." \
              "La causa esta en un paso ANTERIOR del job — mira el log.")
          elif [ -n "$fallidos" ]; then
            asunto="hay tests en rojo"
            detalle=$(printf '%s\n' \
              "CI de $REPO ($RAMA): hay pasos de test en ROJO que el run marca como verde." \
              "" \
              "Estos pasos son advisory a proposito (continue-on-error), asi que el run NO se pone" \
              "en rojo y el repo sigue mergeando. Este aviso existe para que el rojo no pase inadvertido." \
              "" \
              "Pasos en rojo:$(printf '%b' "$fallidos")")
          else
            if [ "$UI_TOCABA" = "true" ]; then
              echo "::notice title=Suite en verde::Los tres pasos advisory corrieron (UI incluida) y ninguno fallo."
            else
              echo "::notice title=Suite en verde::Los dos pasos de unit corrieron y ninguno fallo. La UI corre en la nocturna."
            fi
            echo "hay_aviso=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          texto=$(printf '%s\n' \
            "$detalle" \
            "" \
            "HEAD: $SHA" \
            "Log completo: $RUN_URL")

          # Un texto de varias lineas necesita delimitador; sin el, `$GITHUB_OUTPUT` se
          # queda con la primera linea y el aviso viaja decapitado.
          {
            echo "hay_aviso=si"
            echo "asunto=$asunto"
            echo "texto<<FIN_DEL_AVISO"
            printf '%s\n' "$texto"
            echo "FIN_DEL_AVISO"
          } >> "$GITHUB_OUTPUT"

      - name: Entregar el aviso
        if: ${{ steps.componer.outputs.hay_aviso == 'si' }}
        uses: ./.github/actions/avisar
        with:
          webhook-url: ${{ secrets.GROK_WEBHOOK_URL }}
          sender-key: ${{ secrets.GROK_WEBHOOK_SENDER_KEY }}
          github-token: ${{ github.token }}
          asunto: ${{ steps.componer.outputs.asunto }}
          texto: ${{ steps.componer.outputs.texto }}
