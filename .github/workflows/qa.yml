name: QA

on:
  push:
  pull_request:

jobs:
  # Barato y rápido: valida el SSOT de cobertura + el ratchet anti-drift.
  # Corre en Linux (solo necesita python3). Bloquea merge si el index regresa.
  coverage-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar coverage-index (ratchet anti-drift)
        run: python3 qa/validate-coverage.py

  # Suite de tests. Runner macos-26 (Tahoe): Xcode 26.x (26.0.1–26.5) + sims iOS
  # 26.2/26.4/26.5; `latest-stable` = el 26.x más nuevo (alineado con el dev local).
  # macos-15 NO tiene Xcode 26.x. Build UNA vez + test-without-building.
  #
  # ⚠️ INTERIM (advisory): el primer run completo en CI (run 26843044290, tras
  # arreglar Xcode+Secrets) destapó instabilidad SISTÉMICA del runner frío:
  #   · ~19 clases context-based (`makeTestContext`/SwiftData) flakean/fallan
  #     consistentemente (patrón R8) — p.ej. BudgetFilterRegressionTests,
  #     CategoryDeduplicationServiceTests.
  #   · varios XCUITests flakean por timing en el runner lento.
  # Hasta una estabilización dedicada (root-cause makeTestContext-en-CI o convertir
  # a pure-logic; tunear timing UI), AMBOS pasos son ADVISORY (continue-on-error):
  # corren para visibilidad pero NO bloquean. El gate duro es el job `coverage-index`
  # (validador anti-drift). Ver Lista Negra + plan en TESTING-STRATEGY.md.
  # TODO(@jur, 2026-07-15): estabilizar y volver YalaTests pure-logic a bloqueante.
  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar Xcode (latest-stable 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Secrets.xcconfig está gitignored (API keys); sin él el build falla. El template
      # (placeholders) basta en CI: los tests no llaman APIs reales (LLM/exchange-rate
      # son agentic, fuera de CI).
      - name: Crear Secrets.xcconfig (placeholder para CI)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .ddp \
            -quiet
      - name: Unit tests (YalaTests) — advisory (context-based R8 inestables en CI; ver Lista Negra)
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaTests \
            -skip-testing:YalaTests/BudgetFilterRegressionTests \
            -skip-testing:YalaTests/CategoryDeduplicationServiceTests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -quiet
      - name: UI tests (YalaUITests) — advisory (flaky en runner frío, ver Lista Negra)
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaUITests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -quiet
