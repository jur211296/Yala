name: QA

on:
  push:
  pull_request:

jobs:
  # Barato y rápido: valida el SSOT de cobertura + el ratchet anti-drift.
  # Corre en Linux (solo necesita python3). Bloquea merge si el index regresa.
  coverage-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar coverage-index (ratchet anti-drift)
        run: python3 qa/validate-coverage.py

  # Red dura de "nada se rompe". Runner macos-26 (Tahoe): Xcode 26.x (26.0.1–26.5)
  # + sims iOS 26.2/26.4/26.5; `latest-stable` = el 26.x más nuevo (alineado con el
  # dev local). macos-15 NO tiene Xcode 26.x. Build UNA vez + test-without-building:
  #   · YalaTests (pure-logic)  → BLOQUEANTE (gate real de lógica)
  #   · YalaUITests (regresión) → ADVISORY (continue-on-error): flakean por timing en
  #     el runner lento/frío; corren para visibilidad pero no bloquean hasta estabilizar.
  # Lista Negra (TESTING-STRATEGY.md): se salta BudgetFilterRegressionTests (context-based,
  # flake R8; cubierto por BudgetFilterCSVTests pure-logic).
  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar Xcode (latest-stable 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Secrets.xcconfig está gitignored (API keys); sin él el build falla. El template
      # (placeholders) basta en CI: los tests no llaman APIs reales (LLM/exchange-rate
      # son agentic, fuera de CI).
      - name: Crear Secrets.xcconfig (placeholder para CI)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .ddp \
            -quiet
      - name: Unit tests (YalaTests) — bloqueante
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaTests \
            -skip-testing:YalaTests/BudgetFilterRegressionTests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -quiet
      - name: UI tests (YalaUITests) — advisory (flaky en runner frío, ver Lista Negra)
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -scheme "Yala Dev" \
            -project Yala.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YalaUITests \
            -derivedDataPath .ddp \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -quiet
